<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archived source workbook | GC Equity</title><link rel="stylesheet" href="gc-workspace.css"><style>main{max-width:1200px;margin:auto;padding:1rem;line-height:1.5}label{display:block;font-weight:bold}select,input,button{font:inherit;padding:.5rem;margin:.25rem 0;max-width:100%}.controls{display:flex;gap:1rem;flex-wrap:wrap;align-items:end}.tablebox{overflow:auto;max-width:100%;border:1px solid #888}table{border-collapse:collapse;min-width:100%;text-align:left}td,th{padding:.5rem;border:1px solid #888;vertical-align:top;white-space:pre-wrap}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ba7900;outline-offset:3px}</style><link rel="stylesheet" href="./gc-shared-shell.css?v=20261126-1" data-gce-shared-shell="css"><script src="./gc-shared-shell.js?v=20261126-1" defer data-gce-shared-shell="js"></script></head><body><main><nav><a href="data-catalogue.html" id="back">Data catalogue</a> · <button id="language" type="button">Français</button></nav><h1 id="title">Archived source workbook</h1><p id="note"></p><p><a id="original" hidden download></a> · <a id="publisher" hidden></a></p><p id="status" role="status" aria-live="polite"></p><div class="controls"><div><label for="sheet" id="sheetLabel"></label><select id="sheet" disabled></select></div><div><label for="search" id="searchLabel"></label><input id="search" type="search" disabled></div><button id="export" disabled></button></div><p id="count" aria-live="polite"></p><div class="tablebox" tabindex="0" role="region" aria-labelledby="title"><table id="table"></table></div><p><button id="prev" disabled></button> <button id="next" disabled></button></p></main><script>
"use strict";
const $=x=>document.getElementById(x), params=new URLSearchParams(location.search);let lang=params.get("lang")==="fr"?"fr":"en", record, archive, zip, sheets=[], strings=[], rows=[], page=0, filtered=[], failure=false, loading=true;
const t=(a,b)=>lang==="fr"?b:a, dec=new TextDecoder(), pageSize=50, maxInflated=64*1024*1024;
function msg(a,b){$("status").textContent=t(a,b)}
function labels(){document.documentElement.lang=lang;document.title=t("Archived source workbook | GC Equity","Classeur source archivé | Équité-GC");$("back").textContent=t("Data catalogue","Catalogue des données");$("back").href="data-catalogue.html?lang="+lang;$("language").textContent=t("Français","English");$("language").lang=t("fr","en");$("title").textContent=record?record.name:t("Archived source workbook","Classeur source archivé");$("note").textContent=t("Original worksheet cells are shown in their published order. Numeric and date cells may appear as stored values, not formatted display values; formulas are not executed. Blank cells and suppression symbols are not estimates. Consult the original workbook for formatting, footnotes and definitions.","Les cellules originales sont affichées dans leur ordre publié. Les valeurs numériques et les dates peuvent être affichées sous leur forme stockée, sans mise en forme; les formules ne sont pas exécutées. Les cellules vides et les symboles de suppression ne sont pas des estimations. Consultez le classeur original pour la mise en forme, les notes et les définitions.");$("sheetLabel").textContent=t("Worksheet","Feuille");$("searchLabel").textContent=t("Search cells","Rechercher dans les cellules");$("export").textContent=t("Export matching rows (CSV)","Exporter les lignes correspondantes (CSV)");$("prev").textContent=t("Previous","Précédent");$("next").textContent=t("Next","Suivant");$("original").textContent=t("Download original workbook","Télécharger le classeur original");$("publisher").textContent=t("Publisher source","Source de l’éditeur");if(failure)msg("Workbook cannot be previewed. Use the original download when available.","Aperçu indisponible. Téléchargez l’original lorsqu’il est disponible.");else if(loading)msg("Loading workbook…","Chargement du classeur…");else msg("Worksheet loaded.","Feuille chargée.");render()}
function xml(bytes){const d=new DOMParser().parseFromString(dec.decode(bytes),"application/xml");if(d.getElementsByTagName("parsererror").length)throw Error("Invalid XML");return d}
const nodes=(d,n)=>Array.from(d.getElementsByTagNameNS("*",n));
function zipIndex(buffer){const v=new DataView(buffer), b=new Uint8Array(buffer);let end=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--){if(v.getUint32(i,true)===0x06054b50&&i+22+v.getUint16(i+20,true)===b.length){end=i;break}}if(end<0)throw Error("ZIP");let p=v.getUint32(end+16,true), count=v.getUint16(end+10,true), entries=new Map();if(count>10000)throw Error("ZIP limit");for(let i=0;i<count;i++){if(v.getUint32(p,true)!==0x02014b50)throw Error("ZIP directory");let method=v.getUint16(p+10,true),size=v.getUint32(p+20,true),out=v.getUint32(p+24,true),n=v.getUint16(p+28,true),extra=v.getUint16(p+30,true),comment=v.getUint16(p+32,true),offset=v.getUint32(p+42,true),name=dec.decode(b.slice(p+46,p+46+n));entries.set(name,{method,size,out,offset});p+=46+n+extra+comment}return {v,b,entries}}
async function get(name){const e=zip.entries.get(name);if(!e||e.out>maxInflated||e.size>maxInflated)throw Error("ZIP entry");const {v,b}=zip,p=e.offset;if(v.getUint32(p,true)!==0x04034b50)throw Error("ZIP header");let start=p+30+v.getUint16(p+26,true)+v.getUint16(p+28,true);if(start+e.size>b.length)throw Error("ZIP range");const input=b.slice(start,start+e.size);if(e.method===0){if(input.length!==e.out)throw Error("ZIP size");return input}if(e.method!==8||typeof DecompressionStream==="undefined")throw Error("Unsupported compression");const reader=new Blob([input]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();let chunks=[],total=0;while(true){const x=await reader.read();if(x.done)break;total+=x.value.length;if(total>e.out||total>maxInflated){await reader.cancel();throw Error("ZIP size")}chunks.push(x.value)}if(total!==e.out)throw Error("ZIP length");const result=new Uint8Array(total);let off=0;for(const c of chunks){result.set(c,off);off+=c.length}return result}
function col(ref){let k=0;for(const c of (ref||"").match(/^[A-Z]+/)?.[0]||""){k=k*26+c.charCodeAt(0)-64}return k-1}
async function selectSheet(){loading=true;failure=false;$("sheet").disabled=true;$("search").disabled=true;$("export").disabled=true;rows=[];labels();try{const sheet=sheets[Number($("sheet").value)],d=xml(await get(sheet.path));const rr=nodes(d,"row");if(rr.length>100000)throw Error("Row limit");let width=0;rows=rr.map((r,i)=>{let cells=[];for(const c of nodes(r,"c")){let j=col(c.getAttribute("r"));if(j<0)j=cells.length;if(j>=256)throw Error("Column limit");const ty=c.getAttribute("t"),v=nodes(c,"v")[0]?.textContent??"";cells[j]=ty==="s"?(strings[Number(v)]??""):ty==="inlineStr"?nodes(c,"t").map(x=>x.textContent).join(""):v;width=Math.max(width,j+1)}return {n:r.getAttribute("r")||String(i+1),cells}});rows.forEach(r=>{r.cells=Array.from({length:width},(_,j)=>r.cells[j]??"")});$("search").value="";page=0;$("search").disabled=false;$("export").disabled=false}catch(e){failure=true;rows=[]}finally{loading=false;$("sheet").disabled=false;labels()}}
function render(){let q=$("search").value.toLocaleLowerCase();filtered=rows.filter(r=>!q||r.cells.some(v=>v.toLocaleLowerCase().includes(q)));let pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages-1);$("count").textContent=t(filtered.length+" matching worksheet rows; page "+(page+1)+" of "+pages,filtered.length+" lignes correspondantes; page "+(page+1)+" sur "+pages);$("prev").disabled=page===0;$("next").disabled=page>=pages-1;const table=$("table");table.replaceChildren();if(!filtered.length)return;const head=table.createTHead().insertRow();let h=document.createElement("th");h.scope="col";h.textContent=t("Source row","Ligne source");head.append(h);for(let i=0;i<filtered[0].cells.length;i++){let a=document.createElement("th");a.scope="col";let n=i+1,s="";while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}a.textContent=s;head.append(a)}const body=table.createTBody();for(const r of filtered.slice(page*pageSize,(page+1)*pageSize)){const tr=body.insertRow();let th=document.createElement("th");th.scope="row";th.textContent=r.n;tr.append(th);r.cells.forEach(v=>tr.insertCell().textContent=v)}}
$("language").onclick=()=>{lang=lang==="fr"?"en":"fr";labels()};$("sheet").onchange=selectSheet;$("search").oninput=()=>{page=0;render()};$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};$("export").onclick=()=>{const quote=v=>'"'+String(v).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';const csv=filtered.map(r=>[r.n,...r.cells].map(quote).join(",")).join("\r\n");const url=URL.createObjectURL(new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="worksheet-"+record.id+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
async function json(path){const r=await fetch(path);if(!r.ok)throw Error("Manifest");return r.json()}
(async()=>{labels();try{const [register,manifest]=await Promise.all([json("data/public-source-register-2026-11-24.json"),json("data/public-source-archive-2026-11-24/manifest.json")]);record=register.entries.find(r=>r.id===params.get("id")&&r.approved===true&&r.scope!=="benchmark"&&r.scope!=="consultation");archive=manifest.files.find(a=>a.id===record?.id&&/^data\/public-source-archive-2026-11-24\/[A-Za-z0-9._-]+\.xlsx$/.test(a.path));if(!record||!archive||archive.bytes>10000000)throw Error("Not approved");$("original").href=archive.path;$("original").hidden=false;if(/^https:\/\//.test(record.source)){$("publisher").href=record.source;$("publisher").hidden=false}const response=await fetch(archive.path);if(!response.ok)throw Error("File");const buffer=await response.arrayBuffer();if(buffer.byteLength!==archive.bytes)throw Error("Size mismatch");zip=zipIndex(buffer);const wb=xml(await get("xl/workbook.xml")),rel=xml(await get("xl/_rels/workbook.xml.rels")),links=new Map(nodes(rel,"Relationship").filter(x=>!x.getAttribute("TargetMode")).map(x=>[x.getAttribute("Id"),x.getAttribute("Target")]));sheets=nodes(wb,"sheet").filter(s=>!s.getAttribute("state")||s.getAttribute("state")==="visible").map(s=>{const id=Array.from(s.attributes).find(a=>a.localName==="id")?.value;let target=links.get(id)||"";let path=target.startsWith("/")?target.slice(1):"xl/"+target;if(!/^xl\/worksheets\/[^/]+\.xml$/.test(path))throw Error("Worksheet path");return {name:s.getAttribute("name"),path}});if(!sheets.length)throw Error("No visible sheets");if(zip.entries.has("xl/sharedStrings.xml"))strings=nodes(xml(await get("xl/sharedStrings.xml")),"si").map(x=>nodes(x,"t").map(y=>y.textContent).join(""));sheets.forEach((s,i)=>$("sheet").add(new Option(s.name,String(i))));await selectSheet()}catch(e){failure=true;loading=false;labels()}})();
</script></body></html>
