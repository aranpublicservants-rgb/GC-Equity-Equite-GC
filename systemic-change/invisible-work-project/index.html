ound:var(--panel);color:var(--text);max-width:100%}select,input,textarea{width:100%}button{cursor:pointer;font-weight:650}button.primary{background:#005b64;color:white;border-color:#005b64}button:hover{text-decoration:underline}.muted,small{color:var(--muted)}.tag{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}dl{margin:0}dt{font-weight:700;margin-top:.8rem}dd{margin:0}.notice{border-left:4px solid var(--accent);padding:.5rem 1rem;background:var(--soft)}.skip{position:absolute;left:-10000px}.skip:focus{left:1rem;top:1rem;background:white;color:black;padding:.5rem;z-index:10}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:.6rem;border-bottom:1px solid var(--line)}.bar{height:.85rem;background:var(--accent);border-radius:.2rem;min-width:0}.bar2{background:#658698}.chartrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 3.5rem;gap:.5rem;align-items:center;margin:.5rem 0}output{display:block;white-space:pre-wrap;background:var(--soft);padding:1rem;border-radius:.4rem;overflow-wrap:anywhere}footer{border-top:1px solid var(--line)}@media print{header{background:white;color:black}header a{color:black}button,.controls,nav,.skip{display:none}body{background:white;color:black}article,fieldset{break-inside:avoid}.card{border:0}a{color:black}}</style></head><body><a class="skip" id="skip" href="#main">Skip to content</a><header id="top"><h1>The Invisible Work Project</h1></header><main id="main"><noscript><p>Enable JavaScript to use this interactive resource. / Activez JavaScript pour utiliser cette ressource interactive.</p><p><a href="../../">GC Equity / Équité-GC</a></p></noscript></main><footer id="foot"></footer><script>const D={"slug":"invisible-work-project","title":["The Invisible Work Project","Le projet du travail invisible"],"intro":["Recognize often-overlooked equity and inclusion contributions. Build a workload and recognition record without assuming entitlement to overtime, compensation or a performance rating.","Reconnaître les contributions à l’équité et à l’inclusion souvent négligées. Constituer un dossier de charge de travail et de reconnaissance sans présumer d’un droit aux heures supplémentaires, à une rémunération ou à une cote de rendement."],"labels":[["Contribution and potential barrier","Contribution et obstacle potentiel"],["Practical recognition or redesign","Reconnaissance ou réorganisation pratique"],["Possible evidence of contribution","Preuves possibles de la contribution"]],"hours":true,"items":[{"title":["Employee network leadership","Leadership des réseaux d’employés"],"detail":["Organizing meetings, analyzing issues and representing employee views can require significant preparation and follow-up. The Call to Action forward direction asks leaders to support employee networks; it does not itself prescribe paid hours for all network activities.","Organiser des réunions, analyser les enjeux et représenter les points de vue des employés peut exiger une préparation et un suivi importants. L’orientation de l’appel à l’action demande de soutenir les réseaux; elle ne prescrit pas en soi des heures rémunérées pour toutes leurs activités."],"action":["Agree on scope, time, realistic workload priorities and executive support. Consider relevant demonstrated competencies in performance conversations, subject to applicable rules.","Convenir de la portée, du temps, des priorités réalistes et du soutien des cadres. Envisager les compétences pertinentes démontrées lors des discussions sur le rendement, sous réserve des règles applicables."],"measure":["Deliverables, recommendations, decisions influenced and agreed work time; avoid employee identities or sensitive cases.","Livrables, recommandations, décisions influencées et temps de travail convenu; éviter les identités ou dossiers sensibles."],"sources":["forward","progress","tbs"]},{"title":["Mentoring and sponsorship","Mentorat et parrainage"],"detail":["Informal career support can be unevenly distributed and poorly visible. Mentoring can help colleagues navigate opportunities, but does not replace fair staffing.","Le soutien informel à la carrière peut être réparti inégalement et peu visible. Le mentorat peut aider les collègues à s’orienter, mais ne remplace pas une dotation équitable."],"action":["Provide structured mentorship, allow participants to opt in, balance the workload across mentors and make opportunities broadly accessible.","Offrir un mentorat structuré et volontaire, équilibrer la charge entre mentors et rendre les possibilités largement accessibles."],"measure":["Mentoring hours, resources created and anonymized participant feedback; distinguish participation from later career outcomes.","Heures de mentorat, ressources créées et rétroaction anonymisée; distinguer participation et résultats de carrière ultérieurs."],"sources":["cta","forward"]},{"title":["Cultural knowledge and education","Savoirs culturels et sensibilisation"],"detail":["Employees may be asked to explain cultural practices or discuss experiences of racism. These contributions should not be presumed to be an obligation based on identity.","On peut demander aux employés d’expliquer des pratiques culturelles ou de parler du racisme vécu. Ces contributions ne doivent pas être présumées obligatoires en raison de l’identité."],"action":["Make participation genuinely voluntary; request consent, agree on scope, respect community protocols and arrange appropriate organizational training rather than relying on individuals.","Rendre la participation réellement volontaire; obtenir le consentement, convenir de la portée, respecter les protocoles communautaires et prévoir une formation organisationnelle appropriée plutôt que de dépendre des individus."],"measure":["Agreed sessions and learning materials; no recording or sharing of personal stories without consent.","Séances convenues et matériel d’apprentissage; aucun enregistrement ni partage de récits personnels sans consentement."],"sources":["forward","progress","chra"]},{"title":["Peer support and emotional labour","Soutien entre pairs et travail émotionnel"],"detail":["Colleagues may offer informal support after difficult workplace experiences. The activity can take time and emotional effort but is not a substitute for formal support or employer duties.","Les collègues peuvent offrir un soutien informel après des expériences difficiles au travail. Cette activité peut exiger du temps et des efforts émotionnels, mais ne remplace ni le soutien officiel ni les obligations de l’employeur."],"action":["Set boundaries, make referral pathways visible and avoid transferring responsibility for resolving harassment or discrimination to volunteers.","Établir des limites, rendre visibles les mécanismes d’orientation et éviter de transférer aux bénévoles la responsabilité de régler le harcèlement ou la discrimination."],"measure":["Aggregate time and resource needs only; never collect names, diagnoses or case narratives.","Temps et besoins en ressources agrégés seulement; ne jamais recueillir noms, diagnostics ou récits de cas."],"sources":["hazard","forward"]},{"title":["Policy analysis and barrier removal","Analyse des politiques et élimination des obstacles"],"detail":["Employees may identify practical barriers, review materials and propose changes outside their routine assignments. Their knowledge can support formal employment systems reviews, while the employer remains responsible.","Les employés peuvent repérer des obstacles pratiques, examiner des documents et proposer des changements hors de leurs tâches habituelles. Leur savoir peut soutenir les examens officiels des systèmes d’emploi; l’employeur demeure responsable."],"action":["Record the problem, solution, contribution and decision; arrange recognition for relevant analytical and collaboration competencies instead of promising a specific rating.","Consigner le problème, la solution, la contribution et la décision; reconnaître les compétences pertinentes d’analyse et de collaboration sans promettre une cote précise."],"measure":["Policies reviewed, recommendations accepted or piloted, implementation and evaluated outcomes.","Politiques examinées, recommandations acceptées ou mises à l’essai, mise en œuvre et résultats évalués."],"sources":["ee","reg","tbs"]},{"title":["Accessibility and inclusion improvements","Améliorations en accessibilité et inclusion"],"detail":["Employees may test accessible documents, identify inaccessible workflows and suggest inclusive formats. This should not shift the responsibility for accessibility onto affected individuals.","Les employés peuvent tester des documents accessibles, repérer des processus inaccessibles et proposer des formats inclusifs. Cela ne doit pas transférer la responsabilité de l’accessibilité aux personnes touchées."],"action":["Assign a responsible function, include accessibility in ordinary work planning and recognize agreed testing or review contributions.","Désigner une fonction responsable, intégrer l’accessibilité à la planification ordinaire et reconnaître les contributions convenues aux essais ou examens."],"measure":["Barriers corrected, accessible formats delivered and feedback on usability; avoid disclosure of disabilities.","Obstacles corrigés, formats accessibles livrés et rétroaction sur l’utilisation; éviter de divulguer les handicaps."],"sources":["dta","pass"]}]},UI={"en":{"home":"GC Equity","hub":"Systemic change tools","lang":"Français","skip":"Skip to content","unofficial":"Independent ARAN resource • Not an official Government of Canada site","guide":"Guided navigator","select":"Choose an issue or stage","search":"Search topics","placeholder":"Search the library","library":"Evidence and practical options","sources":"Sources","notes":"Optional non-identifying notes or proposed local change","owner":"Proposed responsible function (optional)","due":"Target review date (optional)","add" sis-plus.html"],"survey":["2025 Staffing and Non-Partisanship Survey","Sondage sur la dotation et l’impartialité politique 2025","https://www.canada.ca/en/public-service-commission/services/publications/2025-staffing-non-partisanship-survey.html","https://www.canada.ca/en/public-service-commission/services/publications/2025-staffing-non-partisanship-survey.html"],"cta":["Clerk’s 2021 Call to Action","Appel à l’action du greffier de 2021","https://www.canada.ca/en/privy-council/corporate/clerk/call-to-action-anti-racism-equity-inclusion-federal-public-service.html","https://www.canada.ca/en/privy-council/corporate/clerk/call-to-action-anti-racism-equity-inclusion-federal-public-service.html"],"forward":["2023 forward direction","Orientation de 2023","https://www.canada.ca/en/privy-council/corporate/clerk/call-to-action-anti-racism-equity-inclusion-federal-public-service/call-to-action-message-to-deputies.html","https://www.canada.ca/en/privy-council/corporate/clerk/call-to-action-anti-racism-equity-inclusion-federal-public-service/call-to-action-message-to-deputies.html"],"progress":["August 2024 progress report","Rapport d’étape d’août 2024","https://www.canada.ca/en/privy-council/corporate/about-call-action/driving-accountability-forward-direction-call-action-anti-racism-equity-inclusion-federal-public-service.html","https://www.canada.ca/en/privy-council/corporate/about-call-action/driving-accountability-forward-direction-call-action-anti-racism-equity-inclusion-federal-public-service.html"],"responses":["Departmental self-assessments and implementation letters","Autoévaluations ministérielles et lettres de mise en œuvre","https://www.canada.ca/en/privy-council/corporate/about-call-action.html","https://www.canada.ca/en/privy-council/corporate/about-call-action.html"],"dta":["Duty to accommodate: a general process for managers","Obligation d’adaptation : processus général pour les gestionnaires","https://www.canada.ca/en/government/publicservice/wellness-inclusion-diversity-public-service/diversity-inclusion-public-service/working-government-canada-duty-accommodate-right-non-discrimination/duty-accommodate-general-process-managers.html","https://www.canada.ca/en/government/publicservice/wellness-inclusion-diversity-public-service/diversity-inclusion-public-service/working-government-canada-duty-accommodate-right-non-discrimination/duty-accommodate-general-process-managers.html"],"tool":["PSC tool to mitigate biases and barriers","Outil de la CFP pour atténuer les biais et les obstacles","https://www.canada.ca/en/public-service-commission/services/public-service-hiring-guides/tool-mitigating-biases-barriers-assessment.html","https://www.canada.ca/en/public-service-commission/services/public-service-hiring-guides/tool-mitigating-biases-barriers-assessment.html"],"pses":["Public Service Employee Survey","Sondage auprès des fonctionnaires fédéraux","https://www.canada.ca/en/treasury-board-secretariat/services/innovation/public-service-employee-survey.html","https://www.canada.ca/en/treasury-board-secretariat/services/innovation/public-service-employee-survey.html"],"hazard":["Work Place Harassment and Violence Prevention Regulations","Règlement sur la prévention du harcèlement et de la violence dans le lieu de travail","https://laws-lois.justice.gc.ca/eng/regulations/SOR-2020-130/","https://laws-lois.justice.gc.ca/fra/reglements/DORS-2020-130/"],"chra":["Canadian Human Rights Act","Loi canadienne sur les droits de la personne","https://laws-lois.justice.gc.ca/eng/acts/H-6/","https://laws-lois.justice.gc.ca/fra/lois/H-6/"]},LINKS=[{"slug":"barrier-breaker","title":["GC Barrier Breaker","GC – Éliminer les obstacles"],"intro":["Turn a suspected barrier into a concrete policy amendment, with an accountable owner and measurable outcome.","Transformer un obstacle présumé en modification concrète d’une politique, avec un responsable et un résultat mesurable."]},{"slug":"federal-glass-ceiling","title":["The Federal Glass Ceiling","Le plafond de verre fédéral"],"intro":["Explore published workforce, executive and promotion shares. Identify questions to investigate without equating representation differences with proven discrimination.","Explorer les proportions publiées de l’effectif, des cadres et des promotions. Repérer les questions à approfondir sans assimiler les écarts à une discrimination démontrée."]},{"slug":"what-worked","title":["What Worked","Ce qui a fonctionné"],"intro":["A case library separating documented implementation and outputs from proposed interventions. Transfer useful practices without claiming impacts that have not been evaluated.","Une bibliothèque distinguant les mises en œuvre et résultats documentés des interventions proposées. Transposer les pratiques utiles sans prétendre à des effets non évalués."]},{"slug":"official-languages-equity","title":["Official Languages and Equity","Langues officielles et équité"],"intro":["Protect language rights while identifying avoidable barriers to access, learning and career progression. The navigator does not authorize exceptions.","Protéger les droits linguistiques tout en repérant les obstacles évitables à l’accès, à l’apprentissage et à la carrière. Le navigateur n’autorise aucune dérogation."]},{"slug":"equitable-staffing-lab","title":["Equitable Staffing Lab","Laboratoire de dotation équitable"],"intro":["Work through a staffing process before launching it. Identify biases and barriers, select mitigations and document decisions; merit and other legal requirements continue to apply.","Parcourir un processus de dotation avant son lancement. Repérer les biais et obstacles, choisir les mesures d’atténuation et documenter les décisions; le mérite et les autres exigences légales demeurent applicables."]},{"slug":"discretion-navigator","title":["The Discretion Navigator","Navigateur du pouvoir discrétionnaire"],"intro":["Separate mandatory requirements from decisions that may be adapted within delegated authority. Verify the instrumen
