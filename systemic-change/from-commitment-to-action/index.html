g:.6rem;background:var(--panel);color:var(--text);max-width:100%}select,input,textarea{width:100%}button{cursor:pointer;font-weight:650}button.primary{background:#005b64;color:white;border-color:#005b64}button:hover{text-decoration:underline}.muted,small{color:var(--muted)}.tag{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}dl{margin:0}dt{font-weight:700;margin-top:.8rem}dd{margin:0}.notice{border-left:4px solid var(--accent);padding:.5rem 1rem;background:var(--soft)}.skip{position:absolute;left:-10000px}.skip:focus{left:1rem;top:1rem;background:white;color:black;padding:.5rem;z-index:10}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:.6rem;border-bottom:1px solid var(--line)}.bar{height:.85rem;background:var(--accent);border-radius:.2rem;min-width:0}.bar2{background:#658698}.chartrow{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 3.5rem;gap:.5rem;align-items:center;margin:.5rem 0}output{display:block;white-space:pre-wrap;background:var(--soft);padding:1rem;border-radius:.4rem;overflow-wrap:anywhere}footer{border-top:1px solid var(--line)}@media print{header{background:white;color:black}header a{color:black}button,.controls,nav,.skip{display:none}body{background:white;color:black}article,fieldset{break-inside:avoid}.card{border:0}a{color:black}}</style></head><body><a class="skip" id="skip" href="#main">Skip to content</a><header id="top"><h1>From Commitment to Action</h1></header><main id="main"><noscript><p>Enable JavaScript to use this interactive resource. / Activez JavaScript pour utiliser cette ressource interactive.</p><p><a href="../../">GC Equity / Équité-GC</a></p></noscript></main><footer id="foot"></footer><script>const D={"slug":"from-commitment-to-action","title":["From Commitment to Action","De l’engagement à l’action"],"intro":["Track federal equity commitments against documented implementation and outcomes. Start with public evidence, then assess your organization; no departmental status is inferred from a missing report.","Suivre les engagements fédéraux en matière d’équité à partir des preuves de mise en œuvre et des résultats. Partir des données publiques, puis évaluer votre organisation; l’absence de rapport ne permet pas de déduire son état d’avancement."],"labels":[["Commitment and dated evidence","Engagement et preuves datées"],["What to verify locally","Éléments à vérifier localement"],["Outcome / accountability measure","Indicateur de résultat ou de responsabilisation"]],"check":true,"tracking":true,"items":[{"title":["2021 — Clerk’s Call to Action","2021 — Appel à l’action du greffier"],"detail":["The January 2021 Call to Action established common expectations to address systemic racism and increase inclusion, including recruitment, sponsorship and support for Indigenous, Black and other racialized public servants.","L’appel à l’action de janvier 2021 a établi des attentes communes pour lutter contre le racisme systémique et favoriser l’inclusion, notamment le recrutement, le parrainage et le soutien des fonctionnaires autochtones, noirs et autrement racisés."],"action":["Identify the specific commitment, the responsible executive, baseline, target and published implementation evidence. Review the 2021 implementation letters and later self-assessments.","Repérer l’engagement précis, le cadre responsable, la référence, la cible et les preuves publiées de mise en œuvre. Examiner les lettres de 2021 et les autoévaluations ultérieures."],"measure":["Track actual appointments, access to development and employee experience alongside activities; do not treat a commitment as an outcome.","Suivre les nominations réelles, l’accès au perfectionnement et l’expérience des employés, en plus des activités; ne pas confondre engagement et résultat."],"sources":["cta","responses"]},{"title":["2023 — Set goals and measure progress","2023 — Fixer des objectifs et mesurer les progrès"],"detail":["The 2023 forward direction calls for multi-year goals, measurement and consequential accountability. Organizational context matters; aggregate representation alone does not establish equitable outcomes.","L’orientation de 2023 demande des objectifs pluriannuels, des mesures et une responsabilisation assortie de conséquences. Le contexte organisationnel compte; la représentation globale ne démontre pas à elle seule l’équité des résultats."],"action":["Obtain local goals, baselines and reporting periods. Identify which levels, regions or occupational groups are included and which populations are missing.","Obtenir les objectifs locaux, les références et les périodes de déclaration. Repérer les niveaux, régions ou groupes professionnels inclus et les populations manquantes."],"measure":["Percentage of goals with dated baselines, targets, owners and updated measures; report gaps and uncertainty.","Proportion des objectifs dotés de références datées, de cibles, de responsables et de mesures actualisées; signaler les lacunes et l’incertitude."],"sources":["forward","progress"]},{"title":["2024 — Public reporting and accountability","2024 — Rapports publics et responsabilisation"],"detail":["Deputy heads were asked in April 2024 to report on progress. PCO published departmental self-assessments and an August 2024 summary report; these are organizational reports, not independent verification of every result.","En avril 2024, les administrateurs généraux ont été invités à rendre compte des progrès. Le BCP a publié les autoévaluations ministérielles et un rapport sommaire en août 2024; il s’agit de rapports organisationnels, non d’une vérification indépendante de chaque résultat."],"action":["Compare a department’s reported actions across reporting periods. Record the exact source and separate implemented changes from actions described as planned.","Comparer les actions déclarées d’un ministère entre périodes. Consigner la source exacte et distinguer les changements mis en œuvre des actions prévues."],"measure":["Share of commitments with evidence of implementation and evidence of outcomes, tracked separately.","Proportion des engagements accompagnés de preuves de mise en œuvre et de preuves de résultats, suivies séparément."],"sources":["responses","progress"]},{"title":["2024–25 — Leadership development","2024-2025 — Perfectionnement en leadership"],"detail":["The 2024–25 employment equity report states that executive development programs for Indigenous and Black leaders produced 28 and 50 graduates respectively. These are reported outputs, not proof of subsequent promotion.","Le rapport sur l’équité en emploi de 2024-2025 indique que les programmes de perfectionnement des cadres autochtones et noirs ont produit respectivement 28 et 50 diplômés. Il s’agit d’extrants déclarés, non d’une preuve de promotion ultérieure."],"action":["Ask how access to development and sponsorship is distributed and whether participants receive opportunities afterward; protect confidentiality.","Demander comment sont répartis l’accès au perfectionnement et au parrainage et si les participants obtiennent ensuite des possibilités; protéger la confidentialité."],"measure":["Participation, completion, subsequent opportunities, appointments and retention using comparable periods and denominators.","Participation, achèvement, possibilités ultérieures, nominations et maintien en poste avec périodes et dénominateurs comparables."],"sources":["tbs","forward"]},{"title":["2024–25 — Representation and availability","2024-2025 — Représentation et disponibilité"],"detail":["TBS reports core public administration representation of persons with disabilities at 9.0% against workforce availability of 12.0% on March 31, 2025. This aggregate difference is 3 percentage points; it does not identify a causal mechanism.","Le SCT indique une représentation des personnes en situation de handicap de 9,0 % dans l’administration publique centrale, contre une disponibilité de 12,0 % au 31 mars 2025. Cet écart global de 3 points de pourcentage ne précise pas de mécanisme causal."],"action":["Examine organizational data, occupational groups, executive levels and the appropriate availability benchmark. Review recruitment, progression and separation evidence before recommending changes.","Examiner les données de l’organisation, les groupes professionnels, les niveaux de cadres et la référence de disponibilité appropriée. Examiner le recrutement, l’avancement et les départs avant de proposer des changements."],"measure":["Representation versus relevant availability, promotion and separation rates where denominators exist; no inference from suppressed data.","Représentation par rapport à la disponibilité pertinente, taux de promotion et de départ lorsque les dénominateurs existent; aucune déduction à partir de données supprimées."],"sources":["tbs","ee","reg"]},{"title":["Employee networks and lived experience","Réseaux d’employés et expérience vécue"],"detail":["The 2023 direction calls for engaging and supporting employee networks and centring lived experience. The 2024 report acknowledges their role in demanding accountability.","L’orientation de 2023 demande de mobiliser et soutenir les réseaux d’employés et de placer l’expérience vécue au centre des travaux. Le rapport de 2024 reconnaît leur rôle dans la responsabilisation."],"action":["Record consultation timing, recommendations, decision owner, response and implementation follow-up. Do not require networks to carry employer obligations.","Consigner le moment de consultation, les recommandations, le responsable, la réponse et le suivi. Ne pas imposer aux réseaux les obligations de l’employeur."],"measure":["Recommendations receiving a documented response, implemented changes and feedback on effectiveness; distinguish participation from influence.","Recommandations ayant reçu une réponse documentée, changements mis en œuvre et rétroaction sur leur efficacité; distinguer participation et influence."],"sources":["forward","progress"]},{"title":["Workplace experience and survey outcomes","Expérience au travail et résultats des sondages"],"detail":["The 2024–25 employment equity report identifies employee survey results as evidence for understanding persistent disparities. Survey responses are perceptions and experiences, not individual complaint findings.","Le rapport de 2024-2025 sur l’équité en emploi présente les résultats des sondages comme des preuves permettant de comprendre les disparités persistantes. Les réponses reflètent des perceptions et expériences, non des conclusions sur des plaintes individuelles."],"action":["Select consistent survey items, verify question wording and compare group results over time where methodologically sound. Pair with qualitative feedback and process evidence.","Choisir des questions cohérentes, vérifier leur libellé et comparer les résultats par groupe dans le temps lorsque la méthode le permet. Jumeler la rétroaction qualitative et les données de processus."],"measure":["Gaps in reported discrimination, harassment, trust and safety; report response rates, suppression and comparability limits.","Écarts déclarés en matière de discrimination, harcèlement, confiance et sécurité; indiquer taux de réponse, suppression et limites de comparabilité."],"sources":["tbs","pses"]}]},UI={"en":{"home":"GC Equity","hub":"Systemic change tools","lang":"Français","skip":"Skip to content","unofficial":"Independent ARAN resource • Not an official Government of Canada site","guide":"Guided navigator","select":"Choose an issue or stage","search":"Search topics","placeholder":"Search the library","library":"Evidence and practical options","sources":"Sources","notes":"Optional non-identifying notes or proposed local change","owner":"Proposed responsible function (optional)","due":"Target review date (optional)","add":"Generate action record","download":"Download record (.txt)","print":"Print / save as PDF","output":"Your action record","noresult -ethics/official-languages/reports/official-languages-2024-2025.html","https://www.canada.ca/en/treasury-board-secretariat/services/values-ethics/official-languages/reports/official-languages-2024-2025.html"],"pass":["GC Workplace Accessibility Passport","Passeport pour l’accessibilité en milieu de travail du GC","https://www.canada.ca/en/government/publicservice/wellness-inclusion-diversity-public-service/diversity-inclusion-public-service/accessibility-public-service/government-canada-workplace-accessibility-passport/workplace-accessibility-create-passport.html","https://www.canada.ca/en/government/publicservice/wellness-inclusion-diversity-public-service/diversity-inclusion-public-service/accessibility-public-service/government-canada-workplace-accessibility-passport/workplace-accessibility-create-passport.html"],"gba":["GBA Plus steps","Étapes de l’ACS Plus","https://www.canada.ca/en/department-national-defence/services/conduct-and-culture/diversity-inclusion/diversity-equity-inclusion/gender-based-analysis-plus-national-defence/gender-based-analysis-plus-resource-hub/gender-based-analysis-plus-toolkits/steps-doing-gender-based-analysis-plus.html","https://www.canada.ca/en/department-national-defence/services/conduct-and-culture/diversity-inclusion/diversity-equity-inclusion/gender-based-analysis-plus-national-defence/gender-based-analysis-plus-resource-hub/gender-based-analysis-plus-toolkits/steps-doing-gender-based-analysis-plus.html"],"survey":["2025 Staffing and Non-Partisanship Survey","Sondage sur la dotation et l’impartialité politique 2025","https://www.canada.ca/en/public-service-commission/services/publications/2025-staffing-non-partisanship-survey.html","https://www.canada.ca/en/public-service-commission/services/publications/2025-staffing-non-partisanship-survey.html"],"cta":["Clerk’s 2021 Call to Action","Appel à l’action du greffier de 2021","https://www.canada.ca/en/privy-council/corporate/clerk/call-to-action-anti-racism-equity-inclusion-federal- ada.ca/en/public-service-commission/services/public-service-hiring-guides/tool-mitigating-biases-barriers-assessment.html","https://www.canada.ca/en/public-service-commission/services/public-service-hiring-guides/tool-mitigating-biases-barriers-assessment.html"],"pses":["Public Service Employee Survey","Sondage auprès des fonctionnaires fédéraux","https://www.canada.ca/en/treasury-board-secretariat/services/innovation/public-service-employee-survey.html","https://www.canada.ca/en/treasury-board-secretariat/services/innovation/public-service-employee-survey.html"],"hazard":["Work Place Harassment and Violence Prevention Regulations","Règlement sur la prévention du harcèlement et de la violence dans le lieu de travail","https://laws-lois.justice.gc.ca/eng/regulations/SOR-2020-130/","https://laws-lois.justice.gc.ca/fra/reglements/DORS-2020-130/"],"chra":["Canadian Human Rights Act","Loi canadienne sur les droits de la personne","https://laws-lois.justice.gc.ca/eng/acts/H-6/","https://laws-lois.justice.gc.ca/fra/lois/H-6/"]},LINKS=[{"slug":"barrier-breaker","title":["GC Barrier Breaker","GC – Éliminer les obstacles"],"intro":["Turn a suspected barrier into a concrete policy amendment, with an accountable owner and measurable outcome.","Transformer un obstacle présumé en modification concrète d’une politique, avec un responsable et un résultat mesurable."]},{"slug":"federal-glass-ceiling","title":["The Federal Glass Ceiling","Le plafond de verre fédéral"],"intro":["Explore published workforce, executive and promotion shares. Identify questions to investigate without equating representation differences with proven discrimination.","Explorer les proportions publiées de l’effectif, des cadres et des promotions. Repérer les questions à approfondir sans assimiler les écarts à une discrimination démontrée."]},{"slug":"what-worked","title":["What Worked","Ce qui a fonctionné"],"intro":["A case library separating documented implementation and outputs from proposed interventions. ios inspirée de l’ACS Plus. Comparer les options, cerner l’incertitude et produire un relevé des mesures d’atténuation. Il ne s’agit ni d’une prévision ni d’un score validé."]},{"slug":"federal-equity-audit","title":["The Federal Equity Audit","Audit fédéral de l’équité"],"intro":["A self-assessment to identify evidence gaps and improvement priorities. It is not a statutory audit, certification or finding of compliance.","Une autoévaluation pour repérer les lacunes de preuve et les priorités d’amélioration. Elle ne constitue ni un audit légal, ni une certification, ni un constat de conformité."]},{"slug":"from-commitment-to-action","title":["From Commitment to Action","De l’engagement à l’action"],"intro":["Track federal equity commitments against documented implementation and outcomes. Start with public evidence, then assess your organization; no departmental status is inferred from a missing report.","Suivre les engagements fédéraux en matière d’équité à partir des preuves de mise en œuvre et des résultats. Partir des données publiques, puis évaluer votre organisation; l’absence de rapport ne permet pas de déduire son état d’avancement."]},{"slug":"invisible-work-project","title":["The Invisible Work Project","Le projet du travail invisible"],"intro":["Recognize often-overlooked equity and inclusion contributions. Build a workload and recognition record without assuming entitlement to overtime, compensation or a performance rating.","Reconnaître les contributions à l’équité et à l’inclusion souvent négligées. Constituer un dossier de charge de travail et de reconnaissance sans présumer d’un droit aux heures supplémentaires, à une rémunération ou à une cote de rendement."]},{"slug":"managers-equity-toolkit","title":["The Manager’s Equity Toolkit","Trousse d’équité pour les gestionnaires"],"intro":["Work through realistic workplace scenarios. Compare common shortcuts with practical, fairer decisions, identify governing obligations and create an action record; verify
