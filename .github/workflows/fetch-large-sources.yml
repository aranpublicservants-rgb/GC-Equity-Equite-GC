name: Fetch large open.canada.ca files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/large-sources.json
permissions:
  contents: write
concurrency:
  group: fetch-large-sources
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, compress and index
        run: |
          python scripts/fetch-large-sources.py
          python scripts/build-added-sources.py
      - name: Commit the files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/open-canada-2026-11 assets/added-sources.json data/checksums.sha256
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Add large open.canada.ca files, compressed with gzip"
          git pull --rebase origin main
          git push origin HEAD:main
