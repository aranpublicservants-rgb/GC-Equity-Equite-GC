name: Weekly check of official sources
# Compares the "date modified" of each official source with the date recorded in data/source-dates.json.
# When a source has changed, it opens or updates one issue so the site can be refreshed. It never changes the site.
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare source dates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, re, subprocess, urllib.request, urllib.error
          cfg = json.load(open('data/source-dates.json', encoding='utf-8'))
          ua = {'User-Agent': 'GC-Equity-source-check'}
          def get(url, headers=None):
              # curl with an ordinary browser identity. Canada.ca refuses requests from GitHub's servers at the moment;
              # those pages are listed as not reached and are checked by hand.
              cmd = ['curl', '-sSL', '--fail', '--compressed', '--connect-timeout', '15', '--max-time', '30', '-A',
                     'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
                     '-H', 'Accept: text/html,application/json;q=0.9,*/*;q=0.8', '-H', 'Accept-Language: en-CA,en;q=0.8']
              for k, v in (headers or {}).items():
                  cmd += ['-H', k + ': ' + v]
              out = subprocess.run(cmd + [url], capture_output=True, timeout=120)
              if out.returncode != 0:
                  raise RuntimeError('curl exit ' + str(out.returncode))
              return out.stdout.decode('utf-8', 'replace')
          def current(src):
              if src['kind'] == 'canada-page':
                  m = re.search(r'property="dateModified"[^>]*>\s*(\d{4}-\d{2}-\d{2})', get(src['url']))
                  return m.group(1) if m else None
              if src['kind'] == 'open-data':
                  ident = src['url'].rstrip('/').split('/')[-1]
                  data = json.loads(get('https://open.canada.ca/data/api/action/package_show?id=' + ident))
                  return (data.get('result') or {}).get('metadata_modified', '')[:10] or None
              if src['kind'] == 'github':
                  repo = src['url'].split('github.com/')[1].strip('/')
                  data = json.loads(get('https://api.github.com/repos/' + repo + '/commits?per_page=1', {'Authorization': 'Bearer ' + os.environ['GH_TOKEN']}))
                  return data[0]['commit']['committer']['date'][:10] if data else None
              return None
          rows, changed = [], []
          for src in cfg['sources']:
              try:
                  now = current(src)
              except Exception as e:
                  now, note = None, 'not reached (' + (str(e) or type(e).__name__)[:40] + ')'
              else:
                  note = ''
              used = src.get('checked')
              if now and used and now > used:
                  changed.append(src)
                  note = 'changed since the last check'
              elif now and not used:
                  note = note or 'no date recorded yet'
              rows.append('| [' + src['title'] + '](' + src['url'] + ') | ' + (used or '') + ' | ' + (now or '') + ' | ' + note + ' |')
          table = '| Source | Date recorded | Date modified now | Note |\n|---|---|---|---|\n' + '\n'.join(rows)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Official sources\n\n' + table + '\n')
          print(table)
          if not changed:
              print('No source has changed since the last check.')
              raise SystemExit(0)
          title = 'Official sources updated since the site was last refreshed'
          body = ('These sources show a newer "date modified" than the date recorded in data/source-dates.json. '
                  'Check whether the published figures changed and update the site if they did. Then record the new dates in data/source-dates.json.\n\n' + table)
          api = 'https://api.github.com/repos/' + os.environ['REPO'] + '/issues'
          auth = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          issues = json.loads(get(api + '?state=open&per_page=100', auth))
          same = [i for i in issues if i.get('title') == title and 'pull_request' not in i]
          payload = json.dumps({'title': title, 'body': body}).encode('utf-8')
          if same:
              req = urllib.request.Request(api + '/' + str(same[0]['number']), data=payload, method='PATCH', headers={**ua, **auth})
          else:
              req = urllib.request.Request(api, data=payload, method='POST', headers={**ua, **auth})
          with urllib.request.urlopen(req, timeout=40) as r:
              print('Issue', 'updated' if same else 'opened', r.status)
          PY
