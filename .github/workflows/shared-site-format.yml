name: Standardize shared website format
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/*.html', '*.html', 'gc-shared-shell.*', 'scripts/apply-shared-shell.py', '.github/workflows/shared-site-format.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: gc-equity-shared-format
  cancel-in-progress: false
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and verify shared format
        run: |
          node --check gc-shared-shell.js
          python3 scripts/apply-shared-shell.py
          python3 scripts/apply-shared-shell.py --check
      - name: Publish shared format without replacing existing content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -u -- '*.html'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Apply common bilingual GC Equity website shell"
            if git push origin HEAD:main; then
              gh api -X POST repos/${{ github.repository }}/pages/builds || true
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/apply-shared-shell.py
            python3 scripts/apply-shared-shell.py --check
          done
          exit 1
