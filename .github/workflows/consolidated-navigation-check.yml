name: Consolidated navigation and branch browser checks
on:
  push:
    branches: [main]
    paths: ['assets/department-branch-*.js', 'assets/department-branch-*.json', 'assets/department-depth.js', 'assets/data-visuals.js', 'branch-gaps/**', 'data/pses-2024-branch-gaps/**', 'scripts/build-branch-gaps.py', 'website-directory/**', 'youth-and-students/**', 'tests/consolidated-navigation-browser.cjs', 'tests/branch-gaps-browser.cjs', '.github/workflows/consolidated-navigation-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/consolidated-navigation-browser.cjs
      - run: node tests/branch-gaps-browser.cjs
