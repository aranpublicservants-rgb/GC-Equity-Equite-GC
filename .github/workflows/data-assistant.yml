name: Guided dataset assistant
on:
  push:
    branches: [main, assistant-datasets-20261117]
    paths: ['gc-data-assistant*', 'gc-workspace.js', 'index.html', 'assets/assistant-catalogue*', 'scripts/build-assistant-catalogue.py', 'tests/data-assistant*', '.github/workflows/data-assistant.yml']
  pull_request:
    paths: ['gc-data-assistant*', 'assets/assistant-catalogue*', 'tests/data-assistant*', 'index.html']
permissions:
  contents: read
jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete source coverage and adaptive questions
        run: |
          python scripts/build-assistant-catalogue.py --check
          node --test tests/data-assistant.test.cjs
      - name: Install browser checks
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Check desktop and phone journeys in both languages
        run: node tests/data-assistant-browser.cjs
