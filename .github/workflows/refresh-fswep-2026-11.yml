name: Refresh November 2026 public PSC FSWEP source
on:
  push:
    branches: [main]
    paths:
      - scripts/refresh-fswep-2026-11.py
      - .github/workflows/refresh-fswep-2026-11.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gc-equity-fswep-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact public version and check source records
        run: python scripts/refresh-fswep-2026-11.py
      - name: Refresh checksum inventory
        run: python scripts/update-data-checksums.py
      - name: Commit verified source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open-canada-2026-11/psc-fswep-referrals/ data/checksums.sha256
          if git diff --cached --quiet; then echo "No new FSWEP source"; exit 0; fi
          git commit -m "Archive verified November 5, 2026 FSWEP public source"
          git pull --rebase origin main
          git push origin HEAD:main
