name: Recover verified historical survey workbooks
on:
  push:
    branches: [main]
    paths:
      - scripts/recover-historical-workbooks.py
      - .github/workflows/recover-historical-workbooks.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recover-historical-workbooks
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover original workbooks and validate every byte
        run: |
          git fetch origin historical-workbook-transfer
          python3 scripts/recover-historical-workbooks.py
          python3 scripts/update-data-checksums.py
      - name: Publish verified files and checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/open-canada-2026-11/pses-supporting-documentation data/checksums.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore four original historical PSES supporting workbooks"
          git pull --rebase origin main
          git push origin HEAD:main
