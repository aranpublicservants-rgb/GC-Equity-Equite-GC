name: GC Equity FSWEP browser verification
on:
  push:
    branches: [main]
    paths:
      - fswep-browser.html
      - assets/fswep-browser.js
      - tests/fswep-source-browser.cjs
      - data/open-canada-2026-11/psc-fswep-referrals/**
      - .github/workflows/fswep-browser-check.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gc-equity-fswep-browser-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser code and source manifest
        run: |
          node --check assets/fswep-browser.js
          node --check tests/fswep-source-browser.cjs
          python scripts/check-full-source-access.py
      - name: Install test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test English, French and desktop and mobile source browser
        run: node tests/fswep-source-browser.cjs
      - name: Record passed browser verification in repository
        run: |
          mkdir -p data/qa
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          report = {
            'status': 'passed',
            'source': 'Public Service Commission FSWEP referral requests as of 2026-11-05',
            'original_source_records': 72822,
            'tested_commit': os.environ['GITHUB_SHA'],
            'completed_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'coverage': ['desktop Chromium','mobile Pixel 5 viewport','English','French','gzip decode','full row count','filter','sort','pagination','no JavaScript exceptions']
          }
          Path('data/qa/fswep-browser.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qa/fswep-browser.json
          git commit -m "Record successful bilingual FSWEP desktop and mobile browser QA"
          git pull --rebase origin main
          git push origin HEAD:main
