name: Fetch public source register gaps
# Downloads register entries that have no copy in this repository, unchanged, with
# checksums (scripts/fetch-register-gaps.py). Very large CSV files are split into parts
# on the pses-data branch under register-gaps/, which this workflow never removes or
# replaces outside that folder. Free GitHub Actions only.
on:
  push:
    branches: [main]
    paths:
      - 'data/source-register-overrides-2026-11-27.json'
      - 'scripts/fetch-register-gaps.py'
      - 'scripts/reconcile-source-register.py'
      - '.github/workflows/fetch-register-gaps.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Most entries to take in this run (0 = all still missing)'
        default: '25'
      max_bytes:
        description: 'Skip entries larger than this many bytes (0 = no limit)'
        default: '0'
      ids:
        description: 'Only these register entries, comma-separated (optional)'
        default: ''
      retry_failed:
        description: 'Retry entries that failed in earlier runs (true or false)'
        default: 'false'
      budget:
        description: 'Minutes of downloading per run before saving and starting the next run'
        default: '80'
permissions:
  contents: write
  actions: write
concurrency:
  group: fetch-register-gaps
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, store and split
        run: python -u scripts/fetch-register-gaps.py "$RUNNER_TEMP/gaps" --limit "${{ inputs.limit || '0' }}" --max-bytes "${{ inputs.max_bytes || '0' }}" --ids "${{ github.event_name == 'push' && 'GC-0420,GC-0462' || inputs.ids }}" --budget "${{ inputs.budget || '80' }}" $([ "${{ inputs.retry_failed }}" = true ] && echo --retry-failed)
      - name: Publish large parts to the pses-data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "$RUNNER_TEMP/gaps/branch/register-gaps" ]; then
            git worktree add "$RUNNER_TEMP/pses-data" origin/pses-data
            cd "$RUNNER_TEMP/pses-data"
            git checkout -B pses-data
            mkdir -p register-gaps
            cp -r "$RUNNER_TEMP/gaps/branch/register-gaps/." register-gaps/
            git add register-gaps
            git commit -m "Add split copies of large public source register files" || echo "nothing new"
            for i in 1 2 3; do
              if git push origin pses-data; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              git pull --rebase origin pses-data
            done
          fi
      - name: Record copies and refresh status on main
        run: |
          set -e
          cp -r "$RUNNER_TEMP/gaps/main/data/." data/
          python scripts/update-data-checksums.py
          python scripts/build-register-copies.py
          python scripts/reconcile-source-register.py
          python scripts/build-data-coverage.py
          python scripts/update-data-checksums.py
          python scripts/reconcile-source-register.py --check
          git add data/register-gaps-2026-11 data/register-gaps-manifest.json data/source-register-status.json data-coverage.html register-copies.html data/checksums.sha256
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Add copies of public source register entries and refresh register status"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Start the next run while entries remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(cat "$RUNNER_TEMP/gaps/remaining.txt" 2>/dev/null || echo 0)
          echo "Entries remaining: $left"
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$left" -gt 0 ] && [ -z "${{ inputs.ids }}" ]; then
            gh workflow run fetch-register-gaps.yml --ref main -f limit="${{ inputs.limit }}" -f max_bytes="${{ inputs.max_bytes }}" -f ids= -f budget="${{ inputs.budget || '80' }}"
          fi
