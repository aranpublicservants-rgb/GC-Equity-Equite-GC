name: GC Equity desktop and mobile smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'explorer.html'
      - 'sources.html'
      - 'gc-ai.js'
      - 'gc-equity-additions.js'
      - 'gc-tools.js'
      - 'vendor/**'
      - 'data/october-2026/**'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Main page, three paths, chatbot links and languages on desktop and phone
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright');
          const fs=require('fs'),path=require('path'),http=require('http');
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.csv':'text/csv; charset=utf-8','.json':'application/json'};
          const root=process.cwd();
          const server=http.createServer((req,res)=>{
            const filepath=path.resolve(root,'.'+decodeURIComponent(new URL(req.url,'http://localhost').pathname));
            if(!filepath.startsWith(root+path.sep)&&filepath!==root){res.writeHead(403);res.end();return}
            fs.readFile(filepath,(err,bytes)=>{if(err){res.writeHead(404);res.end();return;}res.writeHead(200,{'content-type':mime[path.extname(filepath)]||'application/octet-stream'});res.end(bytes);});
          });
          const big={waitUntil:'load',timeout:120000};
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const addr='http://127.0.0.1:'+server.address().port+'/';
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const mode of [{name:'desktop',opts:{viewport:{width:1366,height:850}}},{name:'mobile',opts:{...devices['Pixel 5']}}]){
                const ctx=await browser.newContext(mode.opts);
                const outside=[];
                await ctx.route(u=>!String(u).startsWith(addr),r=>{outside.push(r.request().url());r.abort();});
                const errors=[];const watch=p=>p.on('pageerror',e=>errors.push(p.url()+' :: '+e.message));
                const overflow=p=>p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2||innerWidth>document.documentElement.clientWidth+2);
                fs.mkdirSync('qa-screenshots',{recursive:true});

                // 1. Main page: three options and the chatbot box
                let page=await ctx.newPage();watch(page);
                await page.goto(addr+'index.html?lang=en');
                const hrefs=await page.$$eval('.choices h3 a',as=>as.map(a=>a.getAttribute('href')));
                if(JSON.stringify(hrefs)!==JSON.stringify(['explorer.html#departments','explorer.html#data','explorer.html#bhome']))throw Error('main options: '+hrefs);
                if(await page.$$eval('#aiBox .gcai-bot',a=>a.length)!==4)throw Error('chatbot links missing');
                if(await page.$$eval('[data-theme-set]',b=>b.length)!==3)throw Error('display choices missing on the main page');
                await page.click('[data-theme-set="contrast"]');
                if(await page.evaluate(()=>document.documentElement.getAttribute('data-theme'))!=='contrast')throw Error('high contrast did not apply');
                await page.click('[data-theme-set="light"]');
                await page.fill('#aiBox textarea','How has representation changed since 2017?');
                const [tab]=await Promise.all([ctx.waitForEvent('page'),page.click('#aiBox .gcai-bot[data-bot="chatgpt"]')]);
                await page.waitForTimeout(800);await tab.close().catch(()=>{});
                if(!outside.some(u=>u.startsWith('https://chatgpt.com/?q=How%20has%20representation')))throw Error('chatbot link did not carry the question: '+outside.join(' '));
                if(await overflow(page))throw Error(mode.name+': main page scrolls sideways');
                await page.screenshot({path:'qa-screenshots/'+mode.name+'-main.png',fullPage:true});
                await page.click('#langToggle');
                await page.waitForFunction(()=>document.documentElement.lang==='fr'&&document.getElementById('choice-groups').getAttribute('href')==='explorer.html?lang=fr#data');
                await page.click('#langToggle');
                await page.close();

                // 2. The old explorer address opens the main page
                page=await ctx.newPage();watch(page);
                await page.goto(addr+'explorer.html',{waitUntil:'domcontentloaded',timeout:120000});
                await page.waitForURL(/index\.html$/,{timeout:60000});
                await page.close();

                // 3. Option 1: choose an organization and see all of its data
                page=await ctx.newPage();watch(page);
                await page.goto(addr+'index.html?lang=en');
                await Promise.all([page.waitForURL(/explorer\.html/,{timeout:120000}),page.click('#choice-departments')]);
                await page.waitForFunction(()=>document.getElementById('opOrg')&&document.getElementById('opOrg').options.length>50,null,{timeout:120000});
                await page.selectOption('#opOrg','Correctional Service Canada');
                await page.waitForFunction(()=>{const s=document.getElementById('gc-d-subgroups');return s&&/1,026/.test(s.textContent)&&/Mobility/.test(s.textContent);},null,{timeout:60000});
                if(!await page.$('#eq-d-branches'))throw Error('branch results missing for the organization');
                if(!await page.$('a.gc-mainlink[href="index.html"]'))throw Error('main page link missing');
                await page.close();

                // 4. Option 2: choose a group and see all of its data
                page=await ctx.newPage();watch(page);
                await page.goto(addr+'explorer.html?lang=en#data',big);
                await page.waitForSelector('#gcGroup',{timeout:60000});
                if(!await page.evaluate(()=>document.body.classList.contains('gc-pending')&&!document.getElementById('view-salary').getClientRects().length))throw Error('data showed before a group was chosen');
                await page.goto(addr+'explorer.html?lang=en&group=black#data',big);
                await page.waitForFunction(()=>/79,400/.test((document.getElementById('gcGroupOut')||{}).textContent||''),null,{timeout:60000});
                await page.waitForFunction(()=>document.querySelectorAll('.gc-hl').length>10,null,{timeout:30000});
                await page.selectOption('#gcGroup','pwd');
                await page.waitForFunction(()=>/9\.0% of employees, compared with workforce availability of 12\.0%/.test(document.getElementById('gcGroupOut').textContent),null,{timeout:30000});
                await page.waitForFunction(()=>document.querySelectorAll('#gtCycleTable td.gt-flag').length>=5,null,{timeout:30000});
                if(await overflow(page))throw Error(mode.name+': group page scrolls sideways');
                await page.screenshot({path:'qa-screenshots/'+mode.name+'-group.png'});
                await page.close();

                // 5. Option 3: presentations and briefing notes
                page=await ctx.newPage();watch(page);
                await page.goto(addr+'explorer.html?lang=en#bhome',big);
                await page.waitForSelector('#view-bhome.active #gtDeckBuild',{timeout:60000});
                if(await page.$$eval('#gc-b-ai .gcai-bot',a=>a.length)!==4)throw Error('briefing chatbot links missing');
                if(mode.name==='desktop'){
                  const [deck]=await Promise.all([page.waitForEvent('download',{timeout:60000}),page.click('#gtDeckBuild')]);
                  if(!/\.pptx$/.test(deck.suggestedFilename()))throw Error('presentation not downloaded: '+deck.suggestedFilename());
                  await page.goto(addr+'explorer.html?lang=en#brief',big);
                  await page.waitForSelector('#view-brief.active #briefWord',{timeout:60000});
                  const [word]=await Promise.all([page.waitForEvent('download',{timeout:60000}),page.click('#briefWord')]);
                  if(!/\.docx$/.test(word.suggestedFilename()))throw Error('briefing note not downloaded: '+word.suggestedFilename());
                }
                await page.close();

                // 6. French links and the source list
                page=await ctx.newPage();watch(page);
                await page.goto(addr+'explorer.html?lang=fr&group=women#data',big);
                await page.waitForFunction(()=>document.documentElement.lang==='fr-CA'&&/56,8\s%/.test((document.getElementById('gcGroupOut')||{}).textContent||''),null,{timeout:60000});
                const alive=await Promise.race([page.evaluate(()=>1+1),new Promise(r=>setTimeout(()=>r('stuck'),5000))]);
                if(alive!==2)throw Error('French page stopped responding');
                await page.goto(addr+'sources.html?lang=fr');
                await page.waitForFunction(()=>document.getElementById('visible').textContent.includes('157 sur 157'));
                await page.close();

                if(errors.length)throw Error(mode.name+': browser errors: '+errors.join(' / '));
                const unexpected=outside.filter(u=>!/^https:\/\/(chatgpt\.com|claude\.ai|copilot\.microsoft\.com|gemini\.google\.com)\//.test(u));
                if(unexpected.length)throw Error(mode.name+': outside requests: '+unexpected.join(' '));
                await ctx.close();
                console.log('PASS: '+mode.name+', main page, chatbot links, three paths, presentation and Word files, French, source list');
              }
            }finally{await browser.close();server.close()}
          })().catch(e=>{console.error(e);server.close();process.exit(1)});
          JS
      - name: Save preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-equity-preview
          path: qa-screenshots/
          if-no-files-found: ignore
