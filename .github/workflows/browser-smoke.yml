name: GC Equity desktop and mobile smoke
on:
  push:
    branches:
      - chatgpt-safe-redesign-2026-11-01
      - chatgpt-unified-workspace-2026-11-01
  pull_request:
    paths:
      - 'index.html'
      - 'site-app.js'
      - 'unified-workspace.js'
      - 'explorer.html'
      - 'sources.html'
      - 'data/october-2026/**'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test desktop, mobile, original explorer and source catalogue
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path'),http=require('http');
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.csv':'text/csv; charset=utf-8','.css':'text/css; charset=utf-8'};
          const root=process.cwd();
          const server=http.createServer((req,res)=>{
            let name=decodeURIComponent(new URL(req.url,'http://localhost').pathname);
            const filepath=path.resolve(root,'.'+name);
            if(!filepath.startsWith(root+path.sep)&&filepath!==root){res.writeHead(403);res.end();return}
            fs.readFile(filepath,(err,bytes)=>{if(err){res.writeHead(404);res.end();return;}res.writeHead(200,{'content-type':mime[path.extname(filepath)]||'application/octet-stream'});res.end(bytes);});
          });
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const addr='http://127.0.0.1:'+server.address().port+'/';
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const mode of [{name:'desktop',width:1366,height:850},{name:'mobile',width:412,height:915}]){
                const page=await browser.newPage({viewport:{width:mode.width,height:mode.height}});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                await page.goto(addr+'index.html',{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>document.getElementById('loadstatus').textContent.includes('8 of 8'),{timeout:15000});
                await page.selectOption('#org',{label:'Indigenous Services Canada'});
                await page.click('#orgGo');
                await page.waitForFunction(()=>document.getElementById('resultBody').textContent.includes('26.9%'));
                await page.selectOption('#group','black');
                await page.click('#groupGo');
                await page.waitForFunction(()=>document.getElementById('resultBody').textContent.includes('79,400'));
                await page.fill('#question','What is Indigenous representation at Indigenous Services Canada?');
                await page.click('#ask');
                await page.waitForFunction(()=>document.getElementById('answer').textContent.includes('26.9%'));
                await page.selectOption('#tooltype','brief');
                await page.click('#toolGo');
                await page.waitForFunction(()=>document.getElementById('draft').value.includes('EQUITY EVIDENCE BRIEFING'));
                await page.click('#workspace-groups');
                await page.waitForFunction(()=>document.getElementById('workspace-groups').getAttribute('aria-selected')==='true');
                await page.click('#workspace-show-explorer');
                await page.waitForFunction(()=>document.getElementById('integrated-explorer').contentDocument?.title?.includes('Equity'),{timeout:60000});
                await page.click('#workspace-show-catalogue');
                await page.waitForFunction(()=>document.getElementById('integrated-catalogue').contentDocument?.getElementById('visible')?.textContent?.includes('157 of 157'),{timeout:30000});
                await page.click('#workspace-show-explorer');
                await page.click('#workspace-tools');
                await page.waitForFunction(()=>document.getElementById('workspace-description').getAttribute('aria-labelledby')==='workspace-tools');
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
                if(overflow){const diag=await page.evaluate(()=>{const items=Array.from(document.querySelectorAll('*'));return {width:innerWidth,documentWidth:document.documentElement.scrollWidth,inner:items.filter(e=>e.scrollWidth>e.clientWidth+4).slice(0,15).map(e=>({tag:e.tagName,id:e.id,client:e.clientWidth,scroll:e.scrollWidth,overflow:getComputedStyle(e).overflowX}))};});console.log('OVERFLOW_DIAGNOSTIC',JSON.stringify(diag));fs.mkdirSync('qa-screenshots',{recursive:true});await page.screenshot({path:'qa-screenshots/mobile-overflow.png',fullPage:true});throw Error(mode.name+': page horizontal overflow');}
                if(errors.length)throw Error(mode.name+': browser errors: '+errors.join(' / '));
                fs.mkdirSync('qa-screenshots',{recursive:true});
                await page.goto(addr+'index.html');
                await page.waitForFunction(()=>document.getElementById('loadstatus').textContent.includes('8 of 8'));
                await page.screenshot({path:'qa-screenshots/'+mode.name+'.png',fullPage:true});
                await page.goto(addr+'sources.html');
                await page.waitForFunction(()=>document.getElementById('visible').textContent.includes('157 of 157'));
                await page.goto(addr+'explorer.html',{waitUntil:'domcontentloaded',timeout:60000});
                const title=await page.title();if(!title.includes('Equity'))throw Error('Preserved explorer unexpected title: '+title);
                await page.close();
                console.log('PASS: '+mode.name+', department, group, question, tools, integrated explorer, in-page catalogue, preserved explorer');
              }
            }finally{await browser.close();server.close()}
          })().catch(e=>{console.error(e);server.close();process.exit(1)});
          JS
      - name: Save preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-equity-preview
          path: qa-screenshots/
          if-no-files-found: ignore
