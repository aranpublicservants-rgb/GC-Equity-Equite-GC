name: GC Equity desktop and mobile smoke
on:
  push:
    branches: [main]
    paths: ['**.html', '**.js', '**.css', 'assets/**', 'data/**', '.github/workflows/browser-smoke.yml']
  pull_request:
    paths: ['**.html', '**.js', '**.css', 'assets/**', 'data/**', '.github/workflows/browser-smoke.yml']
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify same-page tables on desktop and mobile
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright');
          const fs=require('fs'),path=require('path'),http=require('http');
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.csv':'text/csv; charset=utf-8','.json':'application/json','.css':'text/css'};
          const root=process.cwd();
          const server=http.createServer((req,res)=>{
            const filepath=path.resolve(root,'.'+decodeURIComponent(new URL(req.url,'http://localhost').pathname));
            if(!filepath.startsWith(root+path.sep)&&filepath!==root){res.writeHead(403);res.end();return;}
            fs.readFile(filepath,(err,bytes)=>{
              if(err){res.writeHead(404);res.end();return;}
              res.writeHead(200,{'content-type':mime[path.extname(filepath)]||'application/octet-stream'});res.end(bytes);
            });
          });
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const addr='http://127.0.0.1:'+server.address().port+'/';
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const mode of [{name:'desktop',opts:{viewport:{width:1366,height:850}}},{name:'mobile',opts:{...devices['Pixel 5']}}]){
                const ctx=await browser.newContext(mode.opts,{acceptDownloads:true});
                const page=await ctx.newPage(), errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto(addr+'index.html?lang=en');
                const choices=await page.$$eval('.gce-primary-choice',els=>els.map(a=>a.getAttribute('href')));
                if(JSON.stringify(choices)!==JSON.stringify(['#department-data','#equity-data']))throw Error('The two choices must stay on this page: '+choices);
                await page.waitForFunction(()=>document.querySelectorAll('#public-output table').length>=10,null,{timeout:120000});
                await page.waitForFunction(()=>document.querySelectorAll('#org-picker option').length>150,null,{timeout:30000});
                if(await page.locator('#org-output table').count())throw Error('Organization tables must await a selection');
                if(await page.locator('#gce-loading').isVisible())throw Error('Data still loading');
                if(/Browse below|Open the second page|your instructions/i.test(await page.locator('body').innerText()))throw Error('Instructional text in page');
                if(!await page.locator('#public-representation table').count()||!await page.locator('#public-source-inventory table').count())throw Error('Public service-wide tables missing');
                await page.selectOption('#public-group-picker','i');
                if(!await page.locator('#public-history table').count()||!await page.locator('#public-salary-bands table').count())throw Error('Historical or salary equity datasets missing');
                if(await page.locator('#public-survey table thead th').count()!==3)throw Error('Public survey group comparison columns missing');
                await page.selectOption('#public-group-picker','all');
                await page.selectOption('#gce-source-kind','psc');
                const cat=await page.locator('#gce-source-rows tr').count();
                if(cat>15||cat<1)throw Error('PSC catalogue missing or too long');
                await page.click('#gce-source-next');
                if(!/16/.test(await page.locator('#gce-source-count').innerText()))throw Error('Source catalogue paging broken');
                await page.selectOption('#gce-source-kind','snps');
                if(!await page.locator('#gce-source-rows a').count())throw Error('2023/2025 survey official source links missing');
                await page.selectOption('#org-picker','Canada Revenue Agency');
                await page.waitForFunction(()=>document.querySelector('#equity-data').hidden===true&&document.querySelector('#related-public-resources').hidden===true);
                if(await page.locator('#equity-data').isVisible())throw Error('Other organizations and public service-wide data must not be visible after a department is selected');
                await page.waitForFunction(()=>document.querySelectorAll('#org-output table').length>=4,null,{timeout:60000});
                if(!/Canada Revenue Agency/.test(await page.locator('#org-output').innerText()))throw Error('Wrong organization');
                if(!await page.locator('#org-survey table').count())throw Error('Organization survey missing');
                if(await page.locator('#org-staffing table').count())throw Error('Unavailable CRA staffing source should not be represented as published');
                const [csv]=await Promise.all([page.waitForEvent('download'),page.locator('#org-survey .gce-download').first().click()]);
                if(!/\.csv$/.test(csv.suggestedFilename()))throw Error('Table CSV unavailable');
                await page.selectOption('#org-group-picker','b');
                if(await page.locator('#org-survey table thead th').count()!==3)throw Error('Selected-group survey must have overall and group columns');
                await page.selectOption('#org-group-picker','all');
                await page.selectOption('#org-picker','Administrative Tribunals Support Service of Canada');
                await page.waitForFunction(()=>document.querySelectorAll('#org-staffing table').length===1,null,{timeout:30000});
                await page.waitForFunction(()=>document.querySelectorAll('#gce-org-source-tables .gce-org-source').length===17,null,{timeout:45000});
                const sources=await page.$eval('#gce-org-source-tables .gce-org-source',els=>els.map(e=>e.dataset.source));
                if(sources.includes('ar4e.csv')||sources.includes('ar2a.csv'))throw Error('National-only PSC files must never appear under one department');
                await page.locator('.gce-org-source[data-source="adv_type.csv"]').scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>document.querySelector('.gce-org-source[data-source="adv_type.csv"] tbody tr')!==null,null,{timeout:45000});
                const deptRows=await page.locator('.gce-org-source[data-source="adv_type.csv"] tbody tr').count();
                if(deptRows<1||deptRows>18)throw Error('Department-only PSC tables must be present and paginated');
                if(await page.locator('.gce-org-source[data-source="adv_type.csv"] table thead th').count()<2)throw Error('PSC source columns not available');
                const [orgCsv]=await Promise.all([page.waitForEvent('download'),page.locator('.gce-org-source[data-source="adv_type.csv"] .gce-source-export').click()]);
                if(!/selected-organization.csv/.test(orgCsv.suggestedFilename()))throw Error('Department-only CSV export unavailable');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-branch-complete tbody tr').length>0,null,{timeout:120000});
                const branchRows=await page.locator('#gce-branch-complete tbody tr').count();
                if(branchRows>18)throw Error('Branch table should never display more than 18 rows');
                if(!await page.locator('#gce-branch-unit').count()||!await page.locator('#gce-branch-group').count()||!await page.locator('#gce-branch-question').count())throw Error('Branch selectors missing');
                await page.selectOption('#gce-branch-group',{label:'Black'});
                await page.waitForTimeout(250);
                if(await page.locator('#gce-branch-complete tbody tr').count()>18)throw Error('Black branch results not paginated');
                if(!/2024/.test(await page.locator('#org-branches').innerText()))throw Error('2024 inline branch tables unavailable');
                if(!await page.locator('#org-branches .gce-table-wrap').count())throw Error('branch table missing');
                await page.selectOption('#org-picker','Communications Security Establishment');
                await page.waitForFunction(()=>document.querySelectorAll('#org-output table').length>=1);
                if(!/Not in this collection|Not published/.test(await page.locator('#org-output').innerText()))throw Error('Missing-data distinction not shown');

                await page.locator('a.gce-primary-choice[href="#equity-data"]').click();
                await page.waitForFunction(()=>document.querySelector('#equity-data').hidden===false&&document.querySelector('#org-picker').value==='');
                if(!await page.locator('#equity-data').isVisible())throw Error('Second homepage button should reopen public service-wide tables');
                await page.click('#gcw-lang');
                await page.waitForFunction(()=>document.documentElement.lang==='fr'&&/Données sur l’équité/.test(document.querySelector('h1').textContent));
                if(!/Ministères et organismes/.test(await page.locator('#department-data h2').innerText()))throw Error('French section title absent');
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+3))throw Error('Main page overflows viewport: '+mode.name);
                if(errors.length)throw Error('Browser script errors: '+errors.join(' / '));
                fs.mkdirSync('qa-screenshots',{recursive:true});
                await page.screenshot({path:'qa-screenshots/'+mode.name+'-dashboard.png',fullPage:false});
                await ctx.close();
                console.log('PASS: '+mode.name+', same-page data choices, automatic organization tables, public data, CSV, French, suppression labels');
              }
            }finally{await browser.close();server.close();}
          })().catch(e=>{console.error(e);server.close();process.exit(1)});
          JS
      - name: Save preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-equity-preview
          path: qa-screenshots/
          if-no-files-found: ignore
