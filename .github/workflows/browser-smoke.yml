name: GC Equity desktop and mobile smoke
on:
  push:
    branches: [main]
    paths: ['**.html', '**.js', '**.css', 'tests/**', 'assets/**', 'data/**', 'tests/systemic-change-browser.cjs', 'tests/evidence-review-browser.cjs', 'tests/evidence-review.test.cjs', 'tests/department-audit-browser.cjs', '.github/workflows/browser-smoke.yml']
  pull_request:
    paths: ['**.html', '**.js', '**.css', 'tests/**', 'assets/**', 'data/**', 'tests/systemic-change-browser.cjs', 'tests/evidence-review-browser.cjs', 'tests/evidence-review.test.cjs', '.github/workflows/browser-smoke.yml']
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate department source cells, canonical routes and shared site
        run: |
          python scripts/check-site.py
          python scripts/check-dedicated-departments.py
      - name: Install headless browser
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Verify same-page tables on desktop and mobile
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright');
          const fs=require('fs'),path=require('path'),http=require('http');
          const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.csv':'text/csv; charset=utf-8','.json':'application/json','.css':'text/css'};
          const root=process.cwd();
          const server=http.createServer((req,res)=>{
            let filepath=path.resolve(root,'.'+decodeURIComponent(new URL(req.url,'http://localhost').pathname));
            if(filepath.endsWith(path.sep)||fs.existsSync(filepath)&&fs.statSync(filepath).isDirectory())filepath=path.join(filepath,'index.html');
            if(!filepath.startsWith(root+path.sep)&&filepath!==root){res.writeHead(403);res.end();return;}
            fs.readFile(filepath,(err,bytes)=>{
              if(err){res.writeHead(404);res.end();return;}
              res.writeHead(200,{'content-type':mime[path.extname(filepath)]||'application/octet-stream'});res.end(bytes);
            });
          });
          (async()=>{
            await new Promise(resolve=>server.listen(0,'127.0.0.1',resolve));
            const addr='http://127.0.0.1:'+server.address().port+'/';
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              for(const mode of [{name:'desktop',opts:{viewport:{width:1366,height:850}}},{name:'mobile',opts:{...devices['Pixel 5']}}]){
                const ctx=await browser.newContext(mode.opts,{acceptDownloads:true});
                const page=await ctx.newPage(), errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto(addr+'index.html?lang=en&view=table');
                const choices=await page.$$eval('.gce-primary-choice',els=>els.map(a=>a.getAttribute('href')));
                if(JSON.stringify(choices)!==JSON.stringify(['#department-data','#equity-data']))throw Error('The two choices must stay on this page: '+choices);
                await page.waitForFunction(()=>document.querySelectorAll('#public-output table').length>=10,null,{timeout:120000});
                await page.waitForFunction(()=>document.querySelectorAll('#org-picker option').length>150,null,{timeout:30000});
                const namedOptions=await page.locator('#org-picker option').allTextContents();
                if(namedOptions.some(x=>/^(Public Service - Total|Public Service - Average|Micro - Average|Small - Average|Medium - Average|Large - Average)$/i.test(x.trim())))throw Error('National aggregates cannot be selectable as individual departments');
                if(await page.locator('#org-output table').count())throw Error('Organization tables must await a selection');
                if(await page.locator('#gce-loading').isVisible())throw Error('Data still loading');
                if(/Browse below|Open the second page|your instructions/i.test(await page.locator('body').innerText()))throw Error('Instructional text in page');
                if(!await page.locator('#public-representation table').count()||!await page.locator('#public-data-library').count())throw Error('Public service-wide tables missing');
                if(!await page.locator('#public-topic-picker option').count()||!await page.locator('#org-topic-picker option').count())throw Error('Topic selectors missing');
                if(!await page.locator('#public-organization-comparison table').count())throw Error('Department comparisons must be available on the main page');
                await page.locator('#understand-data summary').click();
                if(!await page.locator('#understand-data table').isVisible())throw Error('The introductory source guide must open without leaving the page');
                if(!/Staffing and Non-Partisanship Survey/.test(await page.locator('#understand-data').innerText()))throw Error('Survey abbreviations must be explained');
                await page.locator('#understand-data summary').click();
                await page.locator('#org-search').fill('Fisheries');
                if(await page.locator('#org-picker option').count()!==2)throw Error('Organization search must narrow the list without selecting an employer');
                if(await page.locator('#org-picker').inputValue())throw Error('Searching alone must not select an employer');
                await page.selectOption('#org-picker','Fisheries and Oceans Canada');
                await page.selectOption('#org-group-picker','b');
                await page.selectOption('#org-topic-picker','experience');
                await page.reload();
                await page.waitForFunction(()=>document.querySelector('#org-survey table')!==null);
                if(await page.locator('#org-group-picker').inputValue()!=='b'||await page.locator('#org-topic-picker').inputValue()!=='experience')throw Error('Organization, employee group and topic must survive reload');
                if(!await page.locator('#org-section-index a[href="#org-survey"]').count())throw Error('The section index must include the selected survey');
                if(await page.locator('#org-section-index a[href="#org-plans"]').count())throw Error('The section index must exclude hidden topics');
                await page.selectOption('#org-topic-picker','all');
                await page.selectOption('#org-group-picker','all');
                await page.selectOption('#org-picker','');
                await page.waitForFunction(()=>document.querySelectorAll('#public-output table').length>=10);
                if(!await page.locator('#equity-data').isVisible())throw Error('Clearing the organization must restore public-service tables');
                const organizationValues=await page.locator('#org-picker option').evaluateAll(els=>els.map(el=>el.value));
                if(!organizationValues.includes('Prairies Economic Development Canada')||!organizationValues.some(x=>/^Pacific Economic/.test(x)))throw Error('Distinct successor organizations must remain separate choices');
                await page.selectOption('#public-topic-picker','commitments');
                await page.locator('#public-plans .gce-table-search').fill('Fisheries');
                if(await page.locator('#public-plans tbody tr').count()!==1||!/Fisheries and Oceans/.test(await page.locator('#public-plans tbody').innerText()))throw Error('Table search must filter the full table');
                await page.locator('#public-plans .gce-table-search').fill('');
                const sort=page.locator('#public-plans .gce-sort[data-col="1"]');
                await sort.click();await sort.click();
                if(await sort.locator('..').getAttribute('aria-sort')!=='descending')throw Error('Column sorting must expose its direction');
                const counts=await page.locator('#public-plans tbody tr td:nth-child(2)').allTextContents();
                if(Number(counts[0].replace(/\s/g,''))<Number(counts[1].replace(/\s/g,'')))throw Error('Numeric sorting must put larger counts first');
                await page.locator('#public-plans [data-gcw="capture-table"]').click();
                await page.locator('#gcw-header .gcw-tools-menu summary').click();
                await page.locator('#gcw-header [data-gcw="basket"]').click();
                if(!await page.locator('#gcw-dialog').isVisible())throw Error('Saved evidence must be reachable from the shared menu');
                if(!/2026/.test(await page.locator('#gcw-dialog').innerText()))throw Error('The saved table must be available for a briefing');
                await page.locator('#gcw-dialog [data-gcw="close"]').click();
                await page.selectOption('#public-topic-picker','all');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-raw-file option').length===38,null,{timeout:30000});
                await page.selectOption('#gce-raw-file','data/psc/ar4e.csv');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-raw-table tbody tr').length===18,null,{timeout:30000});
                if(!await page.locator('#gce-raw-next').isEnabled())throw Error('Complete source browser must paginate');
                await page.locator('#gce-raw-next').click();
                if(!/19/.test(await page.locator('#gce-raw-count').innerText()))throw Error('Source browser page two failed');
                await page.selectOption('#gce-raw-kind','women');
                if(await page.locator('#gce-raw-file option').count()!==26)throw Error('Women source datasets missing');
                await page.selectOption('#gce-raw-file','women-femmes/data/csv/women-by-organization-2025.csv');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-raw-table tbody tr').length>0,null,{timeout:30000});
                await page.selectOption('#gce-raw-kind','tbs');
                if(await page.locator('#gce-raw-file option').count()!==5)throw Error('Official 2026 source CSVs missing');
                await page.selectOption('#gce-raw-kind','derived');
                if(await page.locator('#gce-raw-file option').count()!==5)throw Error('Independent derived source tables missing');
                await page.locator('a[data-gce-scope="public"][data-gce-topic="sources"]').click();
                if(await page.locator('#public-topic-picker').inputValue()!=='sources')throw Error('One-click topic navigation failed');
                await page.selectOption('#public-topic-picker','all');

                await page.selectOption('#public-group-picker','i');
                if(!await page.locator('#public-history table').count()||!await page.locator('#public-salary-bands table').count())throw Error('Historical or salary equity datasets missing');
                if(await page.locator('#public-survey table thead th').count()!==3)throw Error('Public survey group comparison columns missing');
                await page.selectOption('#public-group-picker','all');
                await page.selectOption('#gce-raw-kind','restored');
                if(await page.locator('#gce-raw-file option').count()!==60)throw Error('All 60 nationally scoped restored tables and federal-service staffing-survey partitions must be present; the independent imputation source is in its separate derived category');
                await page.selectOption('#gce-raw-file','data/restored/24a44ce4-676a-45c3-9718-db34e6c07755.csv');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-raw-table tbody tr').length>0,null,{timeout:30000});
                if(!/applicants/i.test(await page.locator('#gce-raw-table caption').innerText()))throw Error('Public Service Employment Act source not shown');
                await page.selectOption('#gce-raw-file','data/restored/org/af319ac52c317e9459/federal-public-service-cbe6f8d4.csv.gz');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-raw-table tbody tr').length===18,null,{timeout:40000});
                if(!/Federal Public Service/i.test(await page.locator('#gce-raw-source').innerText()))throw Error('Published federal public service survey scope missing');
                await page.selectOption('#gce-raw-kind','psc');
                if(await page.locator('#gce-raw-file option').count()!==38)throw Error('All 38 locally hosted PSC source files not available');
                await page.selectOption('#org-picker','Canada Revenue Agency');
                await page.waitForFunction(()=>document.querySelector('#public-output').children.length===0);
                if(await page.locator('#public-data-library').count())throw Error('Public service-wide raw tables must not remain in selected department DOM');
                await page.waitForFunction(()=>document.querySelector('#equity-data').hidden===true&&document.querySelector('#related-public-resources').hidden===true);
                if(await page.locator('#equity-data').isVisible())throw Error('Other organizations and public service-wide data must not be visible after a department is selected');
                await page.waitForFunction(()=>document.querySelectorAll('#org-output table').length>=4,null,{timeout:60000});
                if(!/Canada Revenue Agency/.test(await page.locator('#org-output').innerText()))throw Error('Wrong organization');
                if(!await page.locator('#org-survey table').count())throw Error('Organization survey missing');
                await page.waitForFunction(()=>document.querySelectorAll('#org-profile-surveys table').length===4,null,{timeout:30000});
                if(await page.locator('#org-profile-title').innerText()!=='Canada Revenue Agency')throw Error('Department profile uses the wrong employer');
                if(!await page.locator('#org-profile-accommodation table').count()||!await page.locator('#org-profile-health table').count())throw Error('Readable accommodation and mental-health tables missing');
                if(!await page.locator('#org-output .gce-profile-dedicated a[href^="cra/"]').count())throw Error('CRA full-profile link missing');
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+3))throw Error('Selected department profile overflows viewport: '+mode.name);
                await page.locator('[data-profile-question="accommodation"]').click();
                if(!/Q84/.test(await page.locator('#org-profile-answer').innerText()))throw Error('Guided departmental accommodation answer missing');
                if(await page.locator('#org-staffing table').count())throw Error('Unavailable CRA staffing source should not be represented as published');
                const [csv]=await Promise.all([page.waitForEvent('download'),page.locator('#org-survey .gce-download').first().click()]);
                if(!/\.csv$/.test(csv.suggestedFilename()))throw Error('Table CSV unavailable');
                await page.selectOption('#org-group-picker','b');
                if(await page.locator('#org-survey table thead th').count()!==3)throw Error('Selected-group survey must have overall and group columns');
                await page.waitForFunction(()=>document.querySelector('#org-profile-survey-group')?.value==='Black',null,{timeout:30000});
                if(await page.locator('#org-profile-accommodation table thead th').count()!==5)throw Error('Detailed survey must retain response meaning, count and same-employer comparison');
                await page.selectOption('#org-group-picker','all');
                await page.selectOption('#org-picker','Administrative Tribunals Support Service of Canada');
                await page.selectOption('#org-group-picker','w');
                if(!await page.locator('#org-women-representation table').count())throw Error('Published women departmental data missing');
                await page.selectOption('#org-group-picker','all');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-restored-surveys option').length>2,null,{timeout:60000});
                await page.waitForFunction(()=>document.querySelectorAll('#gce-restored-current-surveys tbody tr').length>0,null,{timeout:60000});
                const sourcePreview=await page.locator('#gce-restored-current-surveys tbody tr').count();
                if(sourcePreview>18)throw Error('Restored department-only complete survey must be paginated');
                const sourceZip=await page.locator('#gce-restored-surveys option').count();
                if(sourceZip<3)throw Error('Complete older staffing source collections missing');
                const [completeDownload]=await Promise.all([page.waitForEvent('download'),page.locator('#gce-restored-current-surveys .gce-download').click()]);
                const completeBody=fs.readFileSync(await completeDownload.path(),'utf8');
                if(!completeBody.includes('Administrative Tribunals Support Service of Canada'))throw Error('Complete source download does not contain the selected organization');
                if(completeBody.includes('Agriculture and Agri-Food Canada'))throw Error('Another employer leaked into restored complete source data');
                await page.waitForFunction(()=>document.querySelectorAll('#org-staffing table').length===1,null,{timeout:30000});
                await page.waitForFunction(()=>document.querySelectorAll('#gce-org-source-tables .gce-org-source').length===17,null,{timeout:45000});
                const sources=await page.locator('#gce-org-source-tables .gce-org-source').evaluateAll(els=>els.map(e=>e.dataset.source));
                if(sources.includes('ar4e.csv')||sources.includes('ar2a.csv'))throw Error('National-only PSC files must never appear under one department');
                await page.locator('.gce-org-source[data-source="adv_type.csv"]').scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>document.querySelector('.gce-org-source[data-source="adv_type.csv"] tbody tr')!==null,null,{timeout:45000});
                const deptRows=await page.locator('.gce-org-source[data-source="adv_type.csv"] tbody tr').count();
                if(deptRows<1||deptRows>18)throw Error('Department-only PSC tables must be present and paginated');
                if(await page.locator('.gce-org-source[data-source="adv_type.csv"] table thead th').count()<2)throw Error('PSC source columns not available');
                const [orgCsv]=await Promise.all([page.waitForEvent('download'),page.locator('.gce-org-source[data-source="adv_type.csv"] .gce-source-export').click()]);
                if(!/selected-organization.csv/.test(orgCsv.suggestedFilename()))throw Error('Department-only CSV export unavailable');
                const downloaded=fs.readFileSync(await orgCsv.path(),'utf8');
                const index=JSON.parse(fs.readFileSync(path.join(root,'assets/psc-organization-index.json'),'utf8'));
                const deptCount=index.files.find(x=>x.file==='adv_type.csv').organizations['Administrative Tribunals Support Service of Canada'];
                if(!downloaded.includes('Administrative Tribunals Support Service of Canada'))throw Error('Department name missing from PSC export');
                if(downloaded.includes('Agriculture and Agri-Food Canada')||downloaded.includes('Canada Border Services Agency'))throw Error('Another organization leaked into PSC export');
                if(downloaded.split(/\r?\n/).filter(Boolean).length-1!==deptCount)throw Error('PSC export did not include exactly the selected organization source rows');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-branch-complete tbody tr').length>0,null,{timeout:120000});
                const branchRows=await page.locator('#gce-branch-complete tbody tr').count();
                if(branchRows>18)throw Error('Branch table should never display more than 18 rows');
                if(!await page.locator('#gce-branch-unit').count()||!await page.locator('#gce-branch-group').count()||!await page.locator('#gce-branch-question').count())throw Error('Branch selectors missing');
                await page.selectOption('#gce-branch-group',{label:'Black'});
                await page.waitForTimeout(250);
                if(await page.locator('#gce-branch-complete tbody tr').count()>18)throw Error('Black branch results not paginated');
                if(!/2024/.test(await page.locator('#org-branches').innerText()))throw Error('2024 inline branch tables unavailable');
                if(!await page.locator('#org-branches .gce-table-wrap').count())throw Error('branch table missing');
                await page.selectOption('#org-picker','Canadian Security Intelligence Service');
                await page.waitForFunction(()=>document.querySelectorAll('#gce-restored-workforce option').length>0,null,{timeout:30000});
                const csisOpts=await page.locator('#gce-restored-workforce option').allTextContents();
                if(!csisOpts.some(x=>x.includes('occupational group')))throw Error('Complete CSIS 2017-18 equity file missing from CSIS department view');
                await page.locator('#gce-restored-workforce').selectOption({label:'Representation by employment-equity occupational group, 2017–18'});
                await page.waitForFunction(()=>document.querySelectorAll('#gce-restored-current-workforce tbody tr').length===13,null,{timeout:30000});
                await page.selectOption('#org-picker','Communications Security Establishment');
                await page.waitForFunction(()=>document.querySelectorAll('#org-output table').length>=1);
                if(!/Not in this collection|Not published/.test(await page.locator('#org-output').innerText()))throw Error('Missing-data distinction not shown');

                await page.locator('#gcw-header a[href$="#equity-data"]').click();
                if(await page.locator('#org-picker').inputValue())throw Error('Top navigation did not clear department');
                await page.locator('a.gce-primary-choice[href="#equity-data"]').click();
                await page.waitForFunction(()=>document.querySelector('#equity-data').hidden===false&&document.querySelector('#org-picker').value==='');
                if(!await page.locator('#equity-data').isVisible())throw Error('Second homepage button should reopen public service-wide tables');
                await page.click('#gcw-lang');
                await page.waitForFunction(()=>document.documentElement.lang==='fr'&&/Données sur l’équité/.test(document.querySelector('h1').textContent));
                if(!/Ministères et organismes/.test(await page.locator('#department-data h2').innerText()))throw Error('French section title absent');
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+3))throw Error('Main page overflows viewport: '+mode.name);
                // Default selection opens the full profile on desktop and phone.
                await page.goto(addr+'index.html?lang=en');
                await page.waitForFunction(()=>document.querySelectorAll('#org-picker option').length===248,null,{timeout:60000});
                await page.selectOption('#org-picker','Canada Revenue Agency');
                await page.waitForURL('**/cra/?lang=en');
                await page.waitForFunction(()=>document.querySelectorAll('#lang-en .dp-group option').length>100,null,{timeout:30000});
                await page.selectOption('#lang-en .dp-group','Black');
                if(await page.locator('#lang-en .dp-survey').first().locator('thead th').count()!==4)throw Error('Selected group profile must show own-employer comparison');
                await page.locator('#lang-en [data-guide-topic="accommodation"]').click();
                if(!/Q86/.test(await page.locator('#lang-en .dp-guide-answer').innerText()))throw Error('Department guide missing accommodation evidence');
                await page.locator('#accommodation').scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>document.querySelector('#lang-en section:has(> #accommodation) .dp-survey .dv-widget'),null,{timeout:30000});
                const visual=page.locator('#lang-en section:has(> #accommodation) .dp-survey .dv-widget').first();
                await visual.getByRole('button',{name:'Both',exact:true}).click();
                if(!await visual.locator('svg').count()||!await visual.locator('..').locator('table').isVisible())throw Error('Chart and table must be available together');
                await visual.getByRole('combobox',{name:'Chart type',exact:true}).selectOption('dots');
                if(!await visual.locator('svg circle').count())throw Error('Dot chart not drawn');
                await visual.locator('[data-point]').first().press('Enter');
                if(!/Question/.test(await visual.locator('.dv-details').innerText()))throw Error('Keyboard chart details missing');
                await visual.getByRole('button',{name:'Chart',exact:true}).click();
                if(await visual.locator('..').locator('table').isVisible())throw Error('Chart-only choice did not hide its table');
                await visual.getByRole('combobox',{name:'Chart type',exact:true}).selectOption('heatmap');
                if(!await visual.locator('svg [data-point]').count())throw Error('Heatmap cells missing');
                const [chartImage]=await Promise.all([page.waitForEvent('download'),visual.getByRole('button',{name:'Download chart (PNG)',exact:true}).click()]);
                const imageBytes=fs.readFileSync(await chartImage.path());
                if(imageBytes.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw Error('Chart PNG download invalid');
                await visual.getByRole('button',{name:'Both',exact:true}).click();
                await page.locator('#language').click();
                if(await page.locator('html').getAttribute('lang')!=='fr')throw Error('Department language switch failed');
                if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+3))throw Error('Full profile overflows viewport: '+mode.name);
                // Source-level audit of dedicated and shared departmental routes.
                // Check decoded, department-specific PSES Q86/Q87 against visible 2024 figures.
                for(const [route,q86,q87] of [['isc','64','70'],['dnd','73','78'],['dfo','67','77'],['cra',null,null],['esdc',null,null]]){
                  await page.goto(addr+route+'/index.html?lang=en',{waitUntil:'domcontentloaded'});
                  await page.locator('#gce-depth-load').waitFor({timeout:30000});
                  await page.locator('#gce-depth-load').click();
                  await page.locator('#gce-depth-group').waitFor({timeout:45000});
                  const check=await page.locator('.gce-depth-method').innerText();
                  if(q86&&!check.includes(q86+'%'))throw Error(route+' Q86 source cut mismatch: '+check.slice(0,240));
                  if(q87&&!check.includes(q87+'%'))throw Error(route+' Q87 source cut mismatch: '+check.slice(0,240));
                  await page.locator('[data-depth-tab="survey"]').click();
                  const count=await page.locator('#gce-depth-panel tbody tr').count();
                  if(count!==27)throw Error(route+' has '+count+' PSES questions; expected 27');
                  await page.locator('[data-depth-tab="staffing"]').click();
                  if(await page.locator('#gce-depth-panel tbody tr').count()!==7)throw Error(route+' staffing indicator depth missing');
                  await page.locator('[data-depth-tab="requests"]').click();
                  if(!/applicant|Applicant|candidature/i.test(await page.locator('#gce-depth-request').inputValue()))throw Error(route+' missing actionable staffing evidence request');
                  await page.locator('#language').click();
                  if(await page.locator('html').getAttribute('lang')!=='fr')throw Error(route+' French toggle broken');
                  if(!await page.locator('#gce-depth-root').isVisible())throw Error(route+' shared evidence hidden in French');
                  if(!/Vérification/.test(await page.locator('#gce-depth-root h2').innerText()))throw Error(route+' evidence heading not translated');
                }
                // Agencies without employer-level PSES data must still provide a usable
                // evidence request and must not impute a zero or block recourse.
                await page.goto(addr+'assisted-human-reproduction-agency-of-canada/index.html?lang=en',{waitUntil:'domcontentloaded'});
                await page.locator('#gce-depth-load').click();
                await page.locator('.gce-depth-method').waitFor({timeout:30000});
                const smallAgency=await page.locator('.gce-depth-method').innerText();
                if(!/No employer-level PSES extract/.test(smallAgency))throw Error('Missing-PSES agency needs explicit source-coverage message: '+smallAgency.slice(0,250));
                await page.locator('[data-depth-tab="requests"]').click();
                if(!await page.locator('#gce-depth-request').count())throw Error('Missing-PSES agency cannot prepare evidence requests');
                await page.locator('[data-depth-tab="recourse"]').click();
                if(!await page.locator('a[href*="/recourse/cases/"]').count())throw Error('Missing-PSES agency cannot open recourse library');
                if(errors.length)throw Error('Browser script errors: '+errors.join(' / '));
                fs.mkdirSync('qa-screenshots',{recursive:true});
                await page.screenshot({path:'qa-screenshots/'+mode.name+'-dashboard.png',fullPage:false});
                await ctx.close();
                console.log('PASS: '+mode.name+', same-page data choices, automatic organization tables, public data, CSV, French, suppression labels');
              }
            }finally{await browser.close();server.close();}
          })().catch(e=>{console.error(e);server.close();process.exit(1)});
          JS
      - name: Check the systemic change tools in English and French
        run: node tests/systemic-change-browser.cjs
      - name: Check evidence review on desktop and mobile
