name: GC Equity site validation
on:
  push:
    branches: [main]
    paths: ['**.html', '**.js', '**.mjs', '**.css', 'assets/**', 'data/**', 'scripts/**', '_config.yml', '.github/workflows/site-validate.yml']
  pull_request:
    paths: ['**.html', '**.js', '**.mjs', '**.css', 'assets/**', 'data/**', 'scripts/**', '_config.yml', '.github/workflows/site-validate.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pages, published data, source snapshots and research tools
        run: |
          python scripts/audit-organization-datasets.py
          python scripts/audit-publishing.py
          python scripts/check-site.py
