name: Inventory large open.canada.ca files
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inventory-large-sources
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stream, measure and record
        run: python scripts/inventory-large-sources.py
      - name: Commit the inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/large-sources-inventory.json
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Record size, rows and SHA-256 of large open.canada.ca files"
          git pull --rebase origin main
          git push origin HEAD:main
