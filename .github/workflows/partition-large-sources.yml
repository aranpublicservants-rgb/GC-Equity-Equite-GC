name: Split large open.canada.ca files into small parts
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: partition-large-sources
  cancel-in-progress: false
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        folder: [pses-2024, pses-2022-2023, pses-2020, pses-2019, pses-2018]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stream and split
        run: python scripts/partition-large-pses.py "${{ matrix.folder }}" parts
      - uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.folder }}
          path: parts
          retention-days: 3
  publish:
    needs: split
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: parts-*
          merge-multiple: true
      - name: Commit parts to the pses-data branch and the manifest to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, glob
          out = {'note': 'Byte-for-byte parts of large open.canada.ca CSV files, one gzip part per organization (LEVEL1ID). Each part starts with the published header. Row totals were checked against the source. Parts are served from the pses-data branch.',
                 'base': 'https://cdn.jsdelivr.net/gh/aranpublicservants-rgb/gc-equity-equite-gc@pses-data/', 'datasets': []}
          for f in sorted(glob.glob('incoming/*/manifest.json')):
              out['datasets'].append({'folder': f.split('/')[1], **json.load(open(f))})
          json.dump(out, open('pses-large-manifest.json', 'w'), ensure_ascii=False, indent=1)
          PY
          cp pses-large-manifest.json /tmp/manifest.json
          if git ls-remote --exit-code --heads origin pses-data >/dev/null; then
            git checkout -B pses-data origin/pses-data
          else
            git checkout --orphan pses-data; git rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf pses && mkdir pses && cp -r incoming/* pses/ 2>/dev/null || true
          cp /tmp/manifest.json pses/manifest.json
          git add pses
          git commit -m "Split large PSES files into small parts" || echo "nothing new"
          git push origin pses-data
          git checkout main
          cp /tmp/manifest.json data/pses-large-manifest.json
          git add data/pses-large-manifest.json
          git commit -m "Record the split large PSES files" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
