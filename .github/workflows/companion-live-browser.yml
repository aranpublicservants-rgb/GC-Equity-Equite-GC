name: Companion sites live browser audit
on:
  push:
    branches: [main]
    paths:
      - 'tests/companion-live-browser.cjs'
      - '.github/workflows/companion-live-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/companion-live-browser.cjs
