name: Clear survey questions and staffing explorer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gc-option-descriptions.js','gc-option-descriptions.css','gc-staffing-explorer.js','gc-shared-shell.js','assets/pses-explorer.js','assets/department-depth.js','scripts/test-staffing-explorer.cjs','tests/survey-options-browser.cjs','.github/workflows/survey-options.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-staffing-explorer.cjs
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/survey-options-browser.cjs
